<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundShare — 마이페이지</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js" crossorigin />
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js" crossorigin />
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js" crossorigin />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="css/base.css" />
  </head>
  <body>
    <script src="js/header-loader.js"></script>

    <main class="container">
      <!-- 프로필 헤더 -->
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:28px;flex-wrap:wrap">
        <div id="profileAvatar" class="post-author-avatar"
             style="width:56px;height:56px;font-size:22px;flex-shrink:0">?</div>
        <div style="flex:1;min-width:0">
          <div id="profileName" style="font-size:20px;font-weight:700;letter-spacing:-0.02em">-</div>
          <div id="profileEmail" class="muted small" style="margin-top:2px">-</div>
        </div>
        <a class="btn" href="settings.html">설정</a>
      </div>

      <!-- 탭 -->
      <div class="tabs" id="tabNav">
        <button class="tab-btn active" data-tab="my">포스트</button>
        <button class="tab-btn" data-tab="commented">댓글</button>
        <button class="tab-btn" data-tab="liked">좋아요</button>
      </div>

      <div id="tabContent"></div>
    </main>

    <script src="config.js"></script>
    <script type="module">
      import { loadHeader, initTopbar, requireAuth } from "./js/app.js";
      import {
        getUserPosts, getCommentedPosts, getLikedPosts,
        deletePost, updateComment, deleteComment, toggleLike,
      } from "./js/post.js";
      import { db, getDoc, doc } from "./js/firebase.js";
      import { avatarLetter, timeAgo, escHtml, showToast, resolveAvatars } from "./js/ui.js";

      await loadHeader();
      initTopbar();
      const user = await requireAuth();

      // 프로필
      const name = user.displayName || user.email.split("@")[0];
      const mypageAvatarEl = document.querySelector("#profileAvatar");
      mypageAvatarEl.textContent = avatarLetter(name); // 기본값
      document.querySelector("#profileName").textContent  = name;
      document.querySelector("#profileEmail").textContent = user.email;

      // Firestore에서 photoURL 읽기
      getDoc(doc(db, "users", user.uid)).then((snap) => {
        const photoURL = snap.data()?.photoURL;
        if (photoURL) {
          mypageAvatarEl.innerHTML = `<img src="${photoURL}" alt="프로필" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`;
        }
      }).catch(() => {});

      const PER_PAGE = 10;
      const EMPTY = {
        my:        "아직 작성한 글이 없습니다.",
        commented: "아직 댓글을 단 글이 없습니다.",
        liked:     "아직 좋아요한 글이 없습니다.",
      };

      const cache     = {};
      const pageState = { my: 1, commented: 1, liked: 1 };
      let   activeTab = "my";

      // ── 커버 스택 (index.html과 동일) ────────────────────────────
      function buildCover(tracks) {
        const items = (tracks || []).slice(0, 5);
        let html = '<div class="post-cover-stack">';
        for (let i = 0; i < 5; i++) {
          const t = items[i];
          html += t?.albumArt
            ? `<img class="post-cover-stack-img" src="${escHtml(t.albumArt)}" alt="" />`
            : `<div class="post-cover-stack-empty"></div>`;
        }
        return html + '</div>';
      }

      // ── 포스트 / 좋아요 카드 (index.html post-feed-card 스타일) ──
      function renderPostItem(post, tab) {
        const pid     = escHtml(post.id);
        const isOwner = post.authorId === user.uid;
        const isLiked = tab === "liked";
        const tracks  = Array.isArray(post.tracks) ? post.tracks : (post.track ? [post.track] : []);
        const tags    = (post.tags || []).slice(0, 3);
        const tagsHtml = tags.length
          ? `<div class="post-feed-tags">${tags.map(t => `<span class="post-feed-tag">${escHtml(t)}</span>`).join("")}</div>`
          : "";
        const rawBody = (post.body || "").replace(/<br\s*\/?>/gi, " ").replace(/<[^>]+>/g, "").trim();
        const bodyHtml = rawBody ? `<div class="post-feed-body-text">${escHtml(rawBody)}</div>` : "";

        let dropdownItems = "";
        if (isLiked) {
          dropdownItems = `<button class="post-list-dropdown-item danger" data-action="unlike-post" data-id="${pid}">좋아요 취소</button>`;
        } else if (isOwner) {
          dropdownItems = `<a class="post-list-dropdown-item" href="write.html#${pid}">수정</a>
            <button class="post-list-dropdown-item danger" data-action="delete-post" data-id="${pid}">삭제</button>`;
        }

        return `
        <div style="position:relative">
          <a class="post-feed-card" href="post.html#${pid}">
            ${buildCover(tracks)}
            <div class="post-feed-body">
              <div class="post-feed-title">${escHtml(post.title)}</div>
              <div class="post-feed-author-row">
                ${isLiked ? `
                <span class="post-feed-avatar" data-uid="${escHtml(post.authorId || '')}">${avatarLetter(post.authorName)}</span>
                <span class="post-feed-author">${escHtml(post.authorName || '익명')}</span>
                <span class="post-feed-time">·</span>` : ""}
                <span class="post-feed-time">${timeAgo(post.createdAt)}</span>
                ${post.visibility === "private" ? `<span class="post-feed-time">· 비공개</span>` : ""}
              </div>
              ${bodyHtml}
              <div class="post-feed-footer">
                ${tagsHtml}
                <div class="post-feed-stats">
                  <span class="post-feed-stat">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                    ${post.likeCount || 0}
                  </span>
                  <span class="post-feed-stat">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    ${post.commentCount || 0}
                  </span>
                  <span class="post-feed-stat">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    ${post.viewCount || 0}
                  </span>
                </div>
              </div>
            </div>
          </a>
          ${dropdownItems ? `
          <div class="post-list-more-wrap" style="position:absolute;top:20px;right:0;z-index:2">
            <button class="post-list-more-btn" data-id="${pid}" aria-label="더보기">⋮</button>
            <div class="post-list-dropdown" data-id="${pid}" hidden>${dropdownItems}</div>
          </div>` : ""}
        </div>`;
      }

      // ── 댓글 탭 아이템 ────────────────────────────────────────────
      function renderCommentedItem({ post, comment }) {
        const pid = escHtml(post.id);
        const cid = escHtml(comment.id);
        return `
        <div style="display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)" data-id="${pid}">
          <div style="flex:1;min-width:0;overflow:hidden">
            <a class="post-list-title-link" href="post.html#${pid}"
               style="display:block;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
              ${escHtml(post.title)}
            </a>
            <div class="comment-edit-area"
                 data-post-id="${pid}" data-comment-id="${cid}" data-text="${escHtml(comment.text)}">
              <div class="post-list-comment-text"
                   style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
                ${escHtml(comment.text)}
              </div>
            </div>
          </div>
          <span class="post-list-time" style="flex-shrink:0">${timeAgo(post.createdAt)}</span>
          <div class="post-list-more-wrap" style="flex-shrink:0">
            <button class="post-list-more-btn" data-id="${pid}" aria-label="더보기">⋮</button>
            <div class="post-list-dropdown" data-id="${pid}" hidden>
              <button class="post-list-dropdown-item"
                      data-action="edit-comment"
                      data-post-id="${pid}" data-comment-id="${cid}">수정</button>
              <button class="post-list-dropdown-item danger"
                      data-action="delete-comment"
                      data-post-id="${pid}" data-comment-id="${cid}">삭제</button>
            </div>
          </div>
        </div>`;
      }

      // ── 페이지네이션 ─────────────────────────────────────────────
      function renderPagination(total, page, tab) {
        const totalPages = Math.ceil(total / PER_PAGE);
        if (totalPages <= 1) return "";

        const prev = `<button class="rd-page-btn" data-page="${page-1}" data-tab="${tab}"${page===1?" disabled":""}>‹</button>`;
        const next = `<button class="rd-page-btn" data-page="${page+1}" data-tab="${tab}"${page===totalPages?" disabled":""}>›</button>`;

        let nums = "", prev_n = 0;
        for (let i = 1; i <= totalPages; i++) {
          if (i === 1 || i === totalPages || Math.abs(i - page) <= 2) {
            if (prev_n && i - prev_n > 1) nums += `<span style="padding:0 4px;color:var(--muted)">…</span>`;
            nums += `<button class="rd-page-btn${i===page?" active":""}" data-page="${i}" data-tab="${tab}">${i}</button>`;
            prev_n = i;
          }
        }
        return `<div class="rd-pagination" style="display:flex;align-items:center;justify-content:center;gap:4px;margin-top:20px">${prev}${nums}${next}</div>`;
      }

      // ── 탭 렌더 ─────────────────────────────────────────────────
      function renderTab(tab) {
        const data    = cache[tab];
        const page    = pageState[tab];
        const slice   = data.slice((page - 1) * PER_PAGE, page * PER_PAGE);
        const content = document.querySelector("#tabContent");

        if (!data.length) {
          content.innerHTML = `<div class="muted small" style="text-align:center;padding:40px 0">${EMPTY[tab]}</div>`;
          return;
        }

        const items = tab === "commented"
          ? `<div style="border-top:1px solid var(--line)">${slice.map(renderCommentedItem).join("")}</div>`
          : slice.map((p) => renderPostItem(p, tab)).join("");

        content.innerHTML = items + renderPagination(data.length, page, tab);
        resolveAvatars(content);
      }

      // ── 탭 로드 ─────────────────────────────────────────────────
      async function loadTab(tab) {
        activeTab = tab;
        const content = document.querySelector("#tabContent");
        content.innerHTML = '<div class="skeleton" style="height:200px;border-radius:12px"></div>';
        try {
          if (!cache[tab]) {
            if (tab === "my")             cache[tab] = await getUserPosts(user.uid);
            else if (tab === "commented") cache[tab] = await getCommentedPosts(user.uid);
            else                          cache[tab] = await getLikedPosts(user.uid);
          }
          renderTab(tab);
        } catch (err) {
          content.innerHTML = `<div class="muted small" style="text-align:center;padding:40px 0">${escHtml(err.message)}</div>`;
        }
      }

      // ── 탭 전환 ─────────────────────────────────────────────────
      document.querySelector("#tabNav").addEventListener("click", (e) => {
        const btn = e.target.closest(".tab-btn");
        if (!btn || btn.dataset.tab === activeTab) return;
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        loadTab(btn.dataset.tab);
      });

      // ── tabContent 이벤트 위임 ───────────────────────────────────
      document.querySelector("#tabContent").addEventListener("click", async (e) => {

        // 페이지네이션
        const pageBtn = e.target.closest(".rd-page-btn[data-page]");
        if (pageBtn && !pageBtn.disabled) {
          const pg = Number(pageBtn.dataset.page);
          if (pg) { pageState[pageBtn.dataset.tab] = pg; renderTab(activeTab); }
          document.querySelector("#tabNav").scrollIntoView({ behavior: "smooth", block: "start" });
          return;
        }

        // ⋮ 드롭다운 토글
        const moreBtn = e.target.closest(".post-list-more-btn");
        if (moreBtn) {
          e.stopPropagation();
          const id = moreBtn.dataset.id;
          const dd = document.querySelector(`.post-list-dropdown[data-id="${id}"]`);
          document.querySelectorAll(".post-list-dropdown:not([hidden])").forEach((d) => { if (d !== dd) d.hidden = true; });
          dd.hidden = !dd.hidden;
          return;
        }

        // ── 게시글 삭제 ────────────────────────────────────────────
        const delPost = e.target.closest("[data-action='delete-post']");
        if (delPost) {
          if (!confirm("게시글을 삭제할까요?")) return;
          const id = delPost.dataset.id;
          try {
            await deletePost(id);
            Object.keys(cache).forEach((t) => {
              if (cache[t]) cache[t] = cache[t].filter((p) => (p.id || p.post?.id) !== id);
            });
            showToast("삭제되었습니다.");
            renderTab(activeTab);
          } catch (err) { showToast(err.message, "danger"); }
          return;
        }

        // ── 좋아요 취소 ────────────────────────────────────────────
        const unlikeBtn = e.target.closest("[data-action='unlike-post']");
        if (unlikeBtn) {
          if (!confirm("좋아요를 취소할까요?")) return;
          const id = unlikeBtn.dataset.id;
          try {
            await toggleLike(id);
            if (cache["liked"]) cache["liked"] = cache["liked"].filter((p) => p.id !== id);
            showToast("좋아요가 취소되었습니다.");
            renderTab("liked");
          } catch (err) { showToast(err.message, "danger"); }
          return;
        }

        // ── 댓글 수정 (수정 폼 열기) ───────────────────────────────
        const editComment = e.target.closest("[data-action='edit-comment']");
        if (editComment) {
          const pid = editComment.dataset.postId;
          const cid = editComment.dataset.commentId;
          document.querySelectorAll(".post-list-dropdown:not([hidden])").forEach((d) => d.hidden = true);

          const area = document.querySelector(`.comment-edit-area[data-post-id="${pid}"][data-comment-id="${cid}"]`);
          const curText = area.dataset.text;
          area.innerHTML = `
            <textarea class="input" style="width:100%;min-height:64px;resize:vertical;font-size:13px;padding:8px 10px">${escHtml(curText)}</textarea>
            <div style="display:flex;gap:6px;margin-top:6px">
              <button class="btn primary" data-action="save-comment"
                      data-post-id="${pid}" data-comment-id="${cid}"
                      style="font-size:12px;padding:5px 12px">저장</button>
              <button class="btn" data-action="cancel-edit-comment"
                      data-post-id="${pid}"
                      style="font-size:12px;padding:5px 12px">취소</button>
            </div>`;
          area.querySelector("textarea").focus();
          return;
        }

        // ── 댓글 수정 저장 ─────────────────────────────────────────
        const saveComment = e.target.closest("[data-action='save-comment']");
        if (saveComment) {
          const pid     = saveComment.dataset.postId;
          const cid     = saveComment.dataset.commentId;
          const area    = document.querySelector(`.comment-edit-area[data-post-id="${pid}"][data-comment-id="${cid}"]`);
          const newText = area.querySelector("textarea").value.trim();

          saveComment.disabled = true;
          saveComment.textContent = "저장 중…";
          try {
            await updateComment(pid, cid, newText);
            // 캐시 업데이트
            if (cache["commented"]) {
              const entry = cache["commented"].find((e) => e.comment.id === cid);
              if (entry) entry.comment.text = newText;
            }
            area.dataset.text = newText;
            area.innerHTML = `<div class="post-list-comment-text" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(newText)}</div>`;
            showToast("댓글이 수정되었습니다.");
          } catch (err) {
            showToast(err.message, "danger");
            saveComment.disabled = false;
            saveComment.textContent = "저장";
          }
          return;
        }

        // ── 댓글 수정 취소 ─────────────────────────────────────────
        const cancelEdit = e.target.closest("[data-action='cancel-edit-comment']");
        if (cancelEdit) {
          const pid  = cancelEdit.dataset.postId;
          const area = document.querySelector(`.comment-edit-area[data-post-id="${pid}"]`);
          area.innerHTML = `<div class="post-list-comment-text" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(area.dataset.text)}</div>`;
          return;
        }

        // ── 댓글 삭제 ─────────────────────────────────────────────
        const delComment = e.target.closest("[data-action='delete-comment']");
        if (delComment) {
          if (!confirm("댓글을 삭제할까요?")) return;
          const pid = delComment.dataset.postId;
          const cid = delComment.dataset.commentId;
          try {
            await deleteComment(pid, cid);
            if (cache["commented"]) {
              cache["commented"] = cache["commented"].filter((e) => e.comment.id !== cid);
            }
            showToast("댓글이 삭제되었습니다.");
            renderTab("commented");
          } catch (err) { showToast(err.message, "danger"); }
          return;
        }
      });

      // 드롭다운 외부 클릭 닫기
      document.addEventListener("click", () => {
        document.querySelectorAll(".post-list-dropdown:not([hidden])").forEach((d) => d.hidden = true);
      });

      await loadTab("my");

      // bfcache 복원 시 캐시 초기화 후 현재 탭 재조회
      // bfcache 복원 시 그대로 유지
    </script>
  </body>
</html>
