<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundShare — 마이페이지</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <script src="js/header-loader.js"></script>

    <main class="container">
      <div id="notice" class="notice" hidden></div>

      <!-- 프로필 카드 -->
      <section class="card" style="margin-bottom:16px">
        <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
          <div id="profileAvatar" class="user-avatar-link"
               style="width:56px;height:56px;font-size:22px;flex-shrink:0;pointer-events:none">?</div>
          <div style="flex:1;min-width:0">
            <div id="profileName" style="font-size:18px;font-weight:700;margin-bottom:2px">-</div>
            <div id="profileEmail" class="muted small">-</div>
          </div>
          <a class="btn" href="settings.html">설정</a>
        </div>
      </section>

      <!-- 탭 -->
      <div class="tabs" id="tabNav">
        <button class="tab-btn active" data-tab="my">내 글</button>
        <button class="tab-btn" data-tab="commented">댓글 쓴 글</button>
        <button class="tab-btn" data-tab="liked">좋아요한 글</button>
      </div>

      <div id="tabContent"></div>
    </main>

    <script src="config.js"></script>
    <script type="module">
      import { loadHeader, initTopbar, requireAuth } from "./js/app.js";
      import {
        getUserPosts, getCommentedPosts, getLikedPosts,
        deletePost, updateComment, deleteComment, toggleLike,
      } from "./js/post.js";
      import { db, getDoc, doc } from "./js/firebase.js";
      import { avatarLetter, timeAgo, escHtml, showToast } from "./js/ui.js";

      await loadHeader();
      initTopbar();
      const user = await requireAuth();

      // 프로필
      const name = user.displayName || user.email.split("@")[0];
      const mypageAvatarEl = document.querySelector("#profileAvatar");
      mypageAvatarEl.textContent = avatarLetter(name); // 기본값
      document.querySelector("#profileName").textContent  = name;
      document.querySelector("#profileEmail").textContent = user.email;

      // Firestore에서 photoURL 읽기
      getDoc(doc(db, "users", user.uid)).then((snap) => {
        const photoURL = snap.data()?.photoURL;
        if (photoURL) {
          mypageAvatarEl.innerHTML = `<img src="${photoURL}" alt="프로필" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`;
        }
      }).catch(() => {});

      const PER_PAGE = 10;
      const EMPTY = {
        my:        "아직 작성한 글이 없습니다.",
        commented: "아직 댓글을 단 글이 없습니다.",
        liked:     "아직 좋아요한 글이 없습니다.",
      };

      const cache     = {};
      const pageState = { my: 1, commented: 1, liked: 1 };
      let   activeTab = "my";

      // ── 내 글 / 좋아요한 글 아이템 ──────────────────────────────
      function renderPostItem(post, tab) {
        const pid      = escHtml(post.id);
        const isOwner  = post.authorId === user.uid;
        const isLiked  = tab === "liked";

        let moreMenu = "";
        if (isLiked) {
          moreMenu = `
            <div class="post-list-more-wrap">
              <button class="post-list-more-btn" data-id="${pid}" aria-label="더보기">⋮</button>
              <div class="post-list-dropdown" data-id="${pid}" hidden>
                <button class="post-list-dropdown-item danger"
                        data-action="unlike-post" data-id="${pid}">좋아요 취소</button>
              </div>
            </div>`;
        } else if (isOwner) {
          moreMenu = `
            <div class="post-list-more-wrap">
              <button class="post-list-more-btn" data-id="${pid}" aria-label="더보기">⋮</button>
              <div class="post-list-dropdown" data-id="${pid}" hidden>
                <a class="post-list-dropdown-item" href="write.html#${pid}">수정</a>
                <button class="post-list-dropdown-item danger"
                        data-action="delete-post" data-id="${pid}">삭제</button>
              </div>
            </div>`;
        }

        return `
        <div class="post-list-item">
          <div class="post-list-header">
            <a class="post-list-title-link" href="post.html#${pid}">${escHtml(post.title)}</a>
            <span class="post-list-time">${timeAgo(post.createdAt)}</span>
            ${moreMenu}
          </div>
          ${post.body ? `<div class="post-list-body">${escHtml(post.body)}</div>` : ""}
          <div class="post-list-footer">
            <span>♥ ${post.likeCount || 0}</span>
            <span>💬 ${post.commentCount || 0}</span>
            <span>👁 ${post.viewCount || 0}</span>
          </div>
        </div>`;
      }

      // ── 댓글 쓴 글 아이템 ────────────────────────────────────────
      function renderCommentedItem({ post, comment }) {
        const pid = escHtml(post.id);
        const cid = escHtml(comment.id);
        return `
        <div class="post-list-item" data-id="${pid}">
          <div class="post-list-header">
            <a class="post-list-title-link" href="post.html#${pid}">${escHtml(post.title)}</a>
            <span class="post-list-time">${timeAgo(post.createdAt)}</span>
          </div>
          <div class="post-list-post-meta">
            <span>${escHtml(post.authorName)}</span>
            <span>·</span>
            <span>♥ ${post.likeCount || 0}</span>
            <span>💬 ${post.commentCount || 0}</span>
            <span>👁 ${post.viewCount || 0}</span>
          </div>
          <div class="post-list-comment-row">
            <span class="post-list-comment-label">내 댓글</span>
            <div class="comment-edit-area"
                 style="flex:1;min-width:0"
                 data-post-id="${pid}"
                 data-comment-id="${cid}"
                 data-text="${escHtml(comment.text)}">
              <div class="post-list-comment-text">${escHtml(comment.text)}</div>
            </div>
            <div class="post-list-more-wrap" style="flex-shrink:0">
              <button class="post-list-more-btn" data-id="${pid}" aria-label="더보기">⋮</button>
              <div class="post-list-dropdown" data-id="${pid}" hidden>
                <button class="post-list-dropdown-item"
                        data-action="edit-comment"
                        data-post-id="${pid}" data-comment-id="${cid}">수정</button>
                <button class="post-list-dropdown-item danger"
                        data-action="delete-comment"
                        data-post-id="${pid}" data-comment-id="${cid}">삭제</button>
              </div>
            </div>
          </div>
        </div>`;
      }

      // ── 페이지네이션 ─────────────────────────────────────────────
      function renderPagination(total, page, tab) {
        const totalPages = Math.ceil(total / PER_PAGE);
        if (totalPages <= 1) return "";

        const prev = `<button class="page-btn" data-page="${page-1}" data-tab="${tab}"${page===1?" disabled":""}>‹</button>`;
        const next = `<button class="page-btn" data-page="${page+1}" data-tab="${tab}"${page===totalPages?" disabled":""}>›</button>`;

        let nums = "", prev_n = 0;
        for (let i = 1; i <= totalPages; i++) {
          if (i === 1 || i === totalPages || Math.abs(i - page) <= 2) {
            if (prev_n && i - prev_n > 1) nums += `<span style="padding:0 4px;color:var(--muted)">…</span>`;
            nums += `<button class="page-btn${i===page?" active":""}" data-page="${i}" data-tab="${tab}">${i}</button>`;
            prev_n = i;
          }
        }
        return `<div class="pagination">${prev}${nums}${next}</div>`;
      }

      // ── 탭 렌더 ─────────────────────────────────────────────────
      function renderTab(tab) {
        const data    = cache[tab];
        const page    = pageState[tab];
        const slice   = data.slice((page - 1) * PER_PAGE, page * PER_PAGE);
        const content = document.querySelector("#tabContent");

        if (!data.length) {
          content.innerHTML = `<div class="card empty-state">${EMPTY[tab]}</div>`;
          return;
        }

        const items = tab === "commented"
          ? slice.map(renderCommentedItem).join("")
          : slice.map((p) => renderPostItem(p, tab)).join("");

        content.innerHTML = `
          <div class="post-list">${items}</div>
          ${renderPagination(data.length, page, tab)}`;
      }

      // ── 탭 로드 ─────────────────────────────────────────────────
      async function loadTab(tab) {
        activeTab = tab;
        const content = document.querySelector("#tabContent");
        content.innerHTML = '<div class="skeleton" style="height:200px;border-radius:12px"></div>';
        try {
          if (!cache[tab]) {
            if (tab === "my")             cache[tab] = await getUserPosts(user.uid);
            else if (tab === "commented") cache[tab] = await getCommentedPosts(user.uid);
            else                          cache[tab] = await getLikedPosts(user.uid);
          }
          renderTab(tab);
        } catch (err) {
          content.innerHTML = `<div class="card empty-state">${escHtml(err.message)}</div>`;
        }
      }

      // ── 탭 전환 ─────────────────────────────────────────────────
      document.querySelector("#tabNav").addEventListener("click", (e) => {
        const btn = e.target.closest(".tab-btn");
        if (!btn || btn.dataset.tab === activeTab) return;
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        loadTab(btn.dataset.tab);
      });

      // ── tabContent 이벤트 위임 ───────────────────────────────────
      document.querySelector("#tabContent").addEventListener("click", async (e) => {

        // 페이지네이션
        const pageBtn = e.target.closest(".page-btn[data-page]");
        if (pageBtn && !pageBtn.disabled) {
          const pg = Number(pageBtn.dataset.page);
          if (pg) { pageState[pageBtn.dataset.tab] = pg; renderTab(activeTab); }
          document.querySelector("#tabNav").scrollIntoView({ behavior: "smooth", block: "start" });
          return;
        }

        // ⋮ 드롭다운 토글
        const moreBtn = e.target.closest(".post-list-more-btn");
        if (moreBtn) {
          e.stopPropagation();
          const id = moreBtn.dataset.id;
          const dd = document.querySelector(`.post-list-dropdown[data-id="${id}"]`);
          document.querySelectorAll(".post-list-dropdown:not([hidden])").forEach((d) => { if (d !== dd) d.hidden = true; });
          dd.hidden = !dd.hidden;
          return;
        }

        // ── 게시글 삭제 ────────────────────────────────────────────
        const delPost = e.target.closest("[data-action='delete-post']");
        if (delPost) {
          if (!confirm("게시글을 삭제할까요?")) return;
          const id = delPost.dataset.id;
          try {
            await deletePost(id);
            Object.keys(cache).forEach((t) => {
              if (cache[t]) cache[t] = cache[t].filter((p) => (p.id || p.post?.id) !== id);
            });
            showToast("삭제되었습니다.");
            renderTab(activeTab);
          } catch (err) { showToast(err.message, "danger"); }
          return;
        }

        // ── 좋아요 취소 ────────────────────────────────────────────
        const unlikeBtn = e.target.closest("[data-action='unlike-post']");
        if (unlikeBtn) {
          if (!confirm("좋아요를 취소할까요?")) return;
          const id = unlikeBtn.dataset.id;
          try {
            await toggleLike(id);
            if (cache["liked"]) cache["liked"] = cache["liked"].filter((p) => p.id !== id);
            showToast("좋아요가 취소되었습니다.");
            renderTab("liked");
          } catch (err) { showToast(err.message, "danger"); }
          return;
        }

        // ── 댓글 수정 (수정 폼 열기) ───────────────────────────────
        const editComment = e.target.closest("[data-action='edit-comment']");
        if (editComment) {
          const pid = editComment.dataset.postId;
          const cid = editComment.dataset.commentId;
          document.querySelectorAll(".post-list-dropdown:not([hidden])").forEach((d) => d.hidden = true);

          const area = document.querySelector(`.comment-edit-area[data-post-id="${pid}"][data-comment-id="${cid}"]`);
          const curText = area.dataset.text;
          area.innerHTML = `
            <textarea class="input" style="width:100%;min-height:64px;resize:vertical;font-size:13px;padding:8px 10px">${escHtml(curText)}</textarea>
            <div style="display:flex;gap:6px;margin-top:6px">
              <button class="btn primary" data-action="save-comment"
                      data-post-id="${pid}" data-comment-id="${cid}"
                      style="font-size:12px;padding:5px 12px">저장</button>
              <button class="btn" data-action="cancel-edit-comment"
                      data-post-id="${pid}"
                      style="font-size:12px;padding:5px 12px">취소</button>
            </div>`;
          area.querySelector("textarea").focus();
          return;
        }

        // ── 댓글 수정 저장 ─────────────────────────────────────────
        const saveComment = e.target.closest("[data-action='save-comment']");
        if (saveComment) {
          const pid     = saveComment.dataset.postId;
          const cid     = saveComment.dataset.commentId;
          const area    = document.querySelector(`.comment-edit-area[data-post-id="${pid}"][data-comment-id="${cid}"]`);
          const newText = area.querySelector("textarea").value.trim();

          saveComment.disabled = true;
          saveComment.textContent = "저장 중…";
          try {
            await updateComment(pid, cid, newText);
            // 캐시 업데이트
            if (cache["commented"]) {
              const entry = cache["commented"].find((e) => e.comment.id === cid);
              if (entry) entry.comment.text = newText;
            }
            area.dataset.text = newText;
            area.innerHTML = `<div class="post-list-comment-text">${escHtml(newText)}</div>`;
            showToast("댓글이 수정되었습니다.");
          } catch (err) {
            showToast(err.message, "danger");
            saveComment.disabled = false;
            saveComment.textContent = "저장";
          }
          return;
        }

        // ── 댓글 수정 취소 ─────────────────────────────────────────
        const cancelEdit = e.target.closest("[data-action='cancel-edit-comment']");
        if (cancelEdit) {
          const pid  = cancelEdit.dataset.postId;
          const area = document.querySelector(`.comment-edit-area[data-post-id="${pid}"]`);
          area.innerHTML = `<div class="post-list-comment-text">${escHtml(area.dataset.text)}</div>`;
          return;
        }

        // ── 댓글 삭제 ─────────────────────────────────────────────
        const delComment = e.target.closest("[data-action='delete-comment']");
        if (delComment) {
          if (!confirm("댓글을 삭제할까요?")) return;
          const pid = delComment.dataset.postId;
          const cid = delComment.dataset.commentId;
          try {
            await deleteComment(pid, cid);
            if (cache["commented"]) {
              cache["commented"] = cache["commented"].filter((e) => e.comment.id !== cid);
            }
            showToast("댓글이 삭제되었습니다.");
            renderTab("commented");
          } catch (err) { showToast(err.message, "danger"); }
          return;
        }
      });

      // 드롭다운 외부 클릭 닫기
      document.addEventListener("click", () => {
        document.querySelectorAll(".post-list-dropdown:not([hidden])").forEach((d) => d.hidden = true);
      });

      await loadTab("my");

      // bfcache 복원 시 캐시 초기화 후 현재 탭 재조회
      window.addEventListener("pageshow", (e) => {
        if (e.persisted) {
          Object.keys(cache).forEach((k) => delete cache[k]);
          loadTab(activeTab);
        }
      });
    </script>
  </body>
</html>
