<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundShare — 마이페이지</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/feed.css" />
    <link rel="stylesheet" href="css/profile.css" />
  </head>
  <body>
    <script src="js/header-loader.js"></script>

    <main class="container">
      <!-- 프로필 헤더 -->
      <div class="profile-header">
        <div id="profileAvatar" class="post-author-avatar profile-avatar-lg">?</div>
        <div class="profile-info">
          <div id="profileName" class="profile-name">-</div>
          <div id="profileEmail" class="muted small profile-email">-</div>
        </div>
        <a class="btn" href="settings.html">설정</a>
      </div>

      <!-- 탭 -->
      <div class="tabs" id="tabNav">
        <button class="tab-btn active" data-tab="my">게시글</button>
        <button class="tab-btn" data-tab="commented">댓글</button>
        <button class="tab-btn" data-tab="liked">좋아요</button>
      </div>

      <div id="tabContent"></div>
    </main>

    <script src="config.js"></script>
    <script type="module" src="js/mypage-page.js"></script>
  </body>
</html>
