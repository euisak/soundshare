<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundShare</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <script src="js/header-loader.js"></script>

    <main class="container">
      <div id="notice" class="notice" hidden></div>

      <!-- 장르 필터 -->
      <div class="chips" id="genreFilter" style="margin-bottom:16px">
        <button class="chip active" data-genre="">전체</button>
        <button class="chip" data-genre="k-pop">K-Pop</button>
        <button class="chip" data-genre="pop">Pop</button>
        <button class="chip" data-genre="indie">Indie</button>
        <button class="chip" data-genre="hip-hop">Hip-Hop</button>
        <button class="chip" data-genre="r&b">R&amp;B</button>
        <button class="chip" data-genre="jazz">Jazz</button>
        <button class="chip" data-genre="rock">Rock</button>
        <button class="chip" data-genre="electronic">Electronic</button>
        <button class="chip" data-genre="classical">Classical</button>
      </div>

      <!-- 게시글 목록 -->
      <div class="grid" id="postList"></div>
    </main>

    <script src="config.js"></script>
    <script type="module">
      import { loadHeader, initTopbar } from "./js/app.js";
      import { getPosts } from "./js/post.js";
      import { renderPostCard, resolveAvatars } from "./js/ui.js";

      await loadHeader();
      initTopbar();

      // 장르 필터
      let currentGenre = "";
      document.querySelector("#genreFilter")?.addEventListener("click", async (e) => {
        const chip = e.target.closest("[data-genre]");
        if (!chip) return;
        document.querySelectorAll("#genreFilter .chip").forEach((c) => c.classList.remove("active"));
        chip.classList.add("active");
        currentGenre = chip.dataset.genre;
        await loadPosts();
      });

      async function loadPosts() {
        const list = document.querySelector("#postList");
        list.innerHTML = Array(3).fill('<div class="skeleton" style="height:160px"></div>').join("");
        try {
          const posts = await getPosts({ genre: currentGenre || undefined });
          if (!posts.length) {
            list.innerHTML = '<div class="card empty-state">아직 게시글이 없습니다.<br>첫 번째 추천을 올려보세요!</div>';
            return;
          }
          list.innerHTML = posts.map(renderPostCard).join("");
          resolveAvatars(list); // 프로필 사진 비동기 로드
        } catch (err) {
          list.innerHTML = `<div class="card empty-state">${err.message}</div>`;
        }
      }

      await loadPosts();
    </script>
  </body>
</html>
