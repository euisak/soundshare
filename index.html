<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundShare</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js" crossorigin />
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js" crossorigin />
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js" crossorigin />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <script src="js/header-loader.js"></script>

    <main class="container">

      <!-- 페이지 헤더 -->
      <div class="feed-page-header" id="feedHeader">
        <h1 class="feed-page-title">포스트</h1>
        <div class="feed-sort-wrap">
          <button class="feed-sort-btn" id="sortBtn" type="button">
            <strong id="sortLabel">최신순</strong> ⌄
          </button>
          <div class="feed-sort-menu" id="sortMenu" hidden>
            <button type="button" data-sort="recent">최신순</button>
            <button type="button" data-sort="popular">인기순</button>
            <button type="button" data-sort="oldest">오래된순</button>
          </div>
        </div>
      </div>

      <!-- 검색 모드 메타 -->
      <div id="searchBar" hidden>
        <div id="searchMeta" class="muted small" style="margin-bottom:14px"></div>
      </div>

      <!-- 포스트 목록 -->
      <div id="postList"></div>
      <div id="feedPagination"></div>

    </main>

    <script src="config.js"></script>
    <script type="module">
      import { loadHeader, initTopbar } from "./js/app.js";
      import { getPosts, searchPosts }  from "./js/post.js";
      import { escHtml, timeAgo, avatarLetter, resolveAvatars } from "./js/ui.js";

      await loadHeader();
      initTopbar();

      const PER_PAGE = 15;
      let currentSort   = "recent";
      let currentPage   = 1;
      let filteredPosts = [];
      let isSearchMode  = false;

      const listEl  = document.getElementById("postList");
      const pgEl    = document.getElementById("feedPagination");
      const headerEl = document.getElementById("feedHeader");
      const barEl   = document.getElementById("searchBar");
      const metaEl  = document.getElementById("searchMeta");

      const sortLabels = { recent: "최신순", popular: "인기순", oldest: "오래된순" };

      // ── 커버 스택 ─────────────────────────────────────────
      function buildCover(tracks) {
        const items = (tracks || []).slice(0, 5);
        let html = '<div class="post-cover-stack">';
        for (let i = 0; i < 5; i++) {
          const t = items[i];
          html += t?.albumArt
            ? `<img class="post-cover-stack-img" src="${escHtml(t.albumArt)}" alt="" />`
            : `<div class="post-cover-stack-empty"></div>`;
        }
        html += '</div>';
        return html;
      }

      // ── 카드 렌더 ──────────────────────────────────────────
      function renderCard(post) {
        const tracks = Array.isArray(post.tracks) ? post.tracks : (post.track ? [post.track] : []);
        const tags   = [...(post.tags || []), ...(post.genre || [])].slice(0, 3);
        const tagsHtml = tags.length
          ? `<div class="post-feed-tags">${tags.map(t => `<span class="post-feed-tag">${escHtml(t)}</span>`).join("")}</div>`
          : "";

        // 본문 텍스트 추출 (HTML 태그 제거) 후 2줄 요약
        const rawBody = (post.body || "")
          .replace(/<br\s*\/?>/gi, " ")
          .replace(/<[^>]+>/g, "")
          .trim();

        const bodyHtml = rawBody
          ? `<div class="post-feed-body-text">${escHtml(rawBody)}</div>`
          : "";

        return `
        <a class="post-feed-card" href="post.html#${escHtml(post.id)}">
          ${buildCover(tracks)}
          <div class="post-feed-body">
            <div class="post-feed-title">${escHtml(post.title)}</div>
            <div class="post-feed-author-row">
              <span class="post-feed-avatar" data-uid="${escHtml(post.authorId || "")}">${avatarLetter(post.authorName)}</span>
              <span class="post-feed-author">${escHtml(post.authorName || "익명")}</span>
              <span class="post-feed-time">· ${timeAgo(post.createdAt)}</span>
            </div>
            ${bodyHtml}
            ${tagsHtml}
            <div class="post-feed-stats">
              <span class="post-feed-stat">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                </svg>
                ${post.likeCount || 0}
              </span>
              <span class="post-feed-stat">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                ${post.commentCount || 0}
              </span>
              <span class="post-feed-stat">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
                ${post.viewCount || 0}
              </span>
            </div>
          </div>
        </a>`;
      }

      // ── 페이지네이션 ───────────────────────────────────────
      function renderPagination(total, page) {
        const totalPages = Math.ceil(total / PER_PAGE);
        if (totalPages <= 1) return "";
        const prev = `<button class="rd-page-btn" data-page="${page - 1}"${page === 1 ? " disabled" : ""}>‹</button>`;
        const next = `<button class="rd-page-btn" data-page="${page + 1}"${page === totalPages ? " disabled" : ""}>›</button>`;
        let nums = "", prevN = 0;
        for (let i = 1; i <= totalPages; i++) {
          if (i === 1 || i === totalPages || Math.abs(i - page) <= 2) {
            if (prevN && i - prevN > 1) nums += `<span style="padding:0 4px;color:var(--muted)">…</span>`;
            nums += `<button class="rd-page-btn${i === page ? " active" : ""}" data-page="${i}">${i}</button>`;
            prevN = i;
          }
        }
        return `<div class="rd-pagination" style="display:flex;align-items:center;justify-content:center;gap:4px;margin-top:20px">${prev}${nums}${next}</div>`;
      }

      // ── 현재 페이지 렌더 ──────────────────────────────────
      function renderPage() {
        const slice = filteredPosts.slice((currentPage - 1) * PER_PAGE, currentPage * PER_PAGE);
        if (!slice.length) {
          listEl.innerHTML = '<div class="empty-state card">게시글이 없습니다.<br>첫 번째 추천을 올려보세요!</div>';
          pgEl.innerHTML = "";
          return;
        }
        listEl.innerHTML = slice.map(renderCard).join("");
        pgEl.innerHTML   = renderPagination(filteredPosts.length, currentPage);
        resolveAvatars(listEl);
      }

      // ── 데이터 로드 ───────────────────────────────────────
      async function loadPosts() {
        isSearchMode = false;
        headerEl.hidden = false;
        barEl.hidden    = true;
        listEl.innerHTML = Array(6).fill(`
          <div class="post-feed-skeleton">
            <div class="post-feed-skeleton-cover"></div>
            <div class="post-feed-skeleton-body">
              <div class="post-feed-skeleton-line" style="width:55%"></div>
              <div class="post-feed-skeleton-line" style="width:30%;height:11px"></div>
              <div class="post-feed-skeleton-line" style="width:20%;height:10px;margin-top:4px"></div>
            </div>
          </div>`).join("");
        pgEl.innerHTML = "";
        try {
          filteredPosts = await getPosts({ sort: currentSort });
          currentPage = 1;
          renderPage();
        } catch (err) {
          listEl.innerHTML = `<div class="card empty-state">${escHtml(err.message)}</div>`;
        }
      }

      // ── 헤더 검색 ─────────────────────────────────────────
      async function doSearch(kw) {
        isSearchMode = true;
        headerEl.hidden = true;
        barEl.hidden    = false;
        pgEl.innerHTML  = "";
        listEl.innerHTML = Array(3).fill(`
          <div class="post-feed-skeleton">
            <div class="post-feed-skeleton-cover"></div>
            <div class="post-feed-skeleton-body">
              <div class="post-feed-skeleton-line" style="width:55%"></div>
              <div class="post-feed-skeleton-line" style="width:30%;height:11px"></div>
              <div class="post-feed-skeleton-line" style="width:20%;height:10px;margin-top:4px"></div>
            </div>
          </div>`).join("");
        metaEl.textContent = "";
        try {
          filteredPosts = await searchPosts(kw, ["title", "artist", "song"]);
          metaEl.textContent = `"${kw}" 검색 결과 ${filteredPosts.length}건`;
          currentPage = 1;
          if (!filteredPosts.length) {
            listEl.innerHTML = `<div class="card empty-state">"${escHtml(kw)}"에 대한 결과가 없습니다.</div>`;
          } else {
            renderPage();
          }
        } catch (err) {
          listEl.innerHTML = `<div class="card empty-state">${escHtml(err.message)}</div>`;
        }
      }

      function exitSearch() {
        const inp = document.querySelector(".topbar-search-input");
        if (inp) inp.value = "";
        loadPosts();
      }

      // ── 헤더 검색창 이벤트 ────────────────────────────────
      document.querySelector(".topbar-search")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const kw = (e.currentTarget.querySelector(".topbar-search-input")?.value || "").trim();
        if (!kw) { exitSearch(); return; }
        await doSearch(kw);
      });
      document.querySelector(".topbar-search-input")?.addEventListener("search", (e) => {
        if (!e.target.value) exitSearch();
      });

      // ── 정렬 드롭다운 ────────────────────────────────────
      const sortBtn  = document.getElementById("sortBtn");
      const sortMenu = document.getElementById("sortMenu");
      const sortLbl  = document.getElementById("sortLabel");

      sortBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        sortMenu.hidden = !sortMenu.hidden;
      });
      sortMenu.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-sort]");
        if (!btn) return;
        currentSort = btn.dataset.sort;
        sortLbl.textContent = sortLabels[currentSort];
        sortMenu.hidden = true;
        currentPage = 1;
        loadPosts();
      });
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".feed-sort-wrap")) sortMenu.hidden = true;
      });

      // ── 페이지네이션 클릭 ────────────────────────────────
      pgEl.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-page]");
        if (!btn || btn.disabled) return;
        currentPage = Number(btn.dataset.page);
        renderPage();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      await loadPosts();

      window.addEventListener("pageshow", (e) => {
        if (e.persisted) exitSearch();
      });
    </script>
  </body>
</html>
