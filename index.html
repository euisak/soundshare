<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundShare</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/feed.css" />
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <script src="js/header-loader.js"></script> <!-- 공통 헤더 + 로그인 모달 삽입 -->

    <main class="container">

      <!-- 피드 헤더 (정렬 드롭다운) — 검색 시 hidden -->
      <div class="feed-page-header" id="feedHeader">
        <h1 class="feed-page-title">게시글</h1> <!-- 제목 -->
        <div class="feed-sort-wrap">
          <button class="feed-sort-btn" id="sortBtn" type="button"> <!-- 정렬 버튼 -->
            <strong id="sortLabel">최신순</strong> ⌄
          </button>
          <div class="feed-sort-menu" id="sortMenu" hidden> <!-- 정렬 드롭다운 -->
            <button type="button" data-sort="recent">최신순</button>
            <button type="button" data-sort="popular">인기순</button>
            <button type="button" data-sort="oldest">오래된순</button>
          </div>
        </div>
      </div>

      <!-- 검색 결과 건수 — 검색 시 표시 -->
      <div id="searchBar" hidden>
        <div id="searchMeta" class="muted small search-meta-bar"></div>
      </div>

      <!-- 포스트 목록 (JS가 renderFeedCard 로 채움) -->
      <div id="postList"></div>
      <!-- 페이지네이션 -->
      <div id="feedPagination"></div>

    </main>

    <script src="config.js"></script>
    <script type="module" src="js/index-page.js"></script>
  </body>
</html>
