<header class="topbar">
  <div class="topbar-inner">

    <a class="brand" href="index.html">
      <span class="brand-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M9 3v10.55A4 4 0 1 0 11 17V7h4V3H9z"/>
        </svg>
      </span>
      <span>SoundShare</span>
    </a>

    <form class="header-search" action="search.html" role="search">
      <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
      <input class="search-input" name="q" type="search"
             placeholder="노래, 아티스트, 태그 검색..." autocomplete="off" />
    </form>

    <nav class="nav">
      <span class="user-chip" data-auth="in" hidden>
        <span class="user-avatar" id="userAvatar">?</span>
        <span class="user-name" id="whoami">-</span>
      </span>

      <button class="icon-btn" id="btnNotif" data-auth="in" hidden aria-label="알림">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="notif-dot" id="notifDot" hidden></span>
      </button>

      <a class="btn" data-auth="out" href="login.html">로그인</a>
      <a class="btn" data-auth="in" href="write.html" hidden>글쓰기</a>
      <a class="btn" data-auth="in" href="mypage.html" hidden>마이</a>
      <button class="btn btn-danger" id="btnLogout" data-auth="in" hidden>로그아웃</button>
    </nav>

  </div>
</header>
