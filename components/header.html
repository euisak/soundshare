<header class="topbar">
  <div class="topbar-inner">

    <a class="brand" href="index.html">
      <span class="brand-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M9 3v10.55A4 4 0 1 0 11 17V7h4V3H9z"/>
        </svg>
      </span>
      <span>SoundShare</span>
    </a>

    <form class="header-search" action="search.html" role="search">
      <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
      <input class="search-input" name="q" type="search"
             placeholder="제목, 노래, 아티스트 검색…" autocomplete="off" />
    </form>

    <nav class="nav">

      <!-- 로그인 시 -->
      <a class="btn" data-auth="in" href="write.html" hidden>글쓰기</a>

      <div class="notif-wrap" data-auth="in" hidden>
        <button class="icon-btn" id="btnNotif" aria-label="알림">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="notif-dot" id="notifDot" hidden></span>
        </button>

        <div class="notif-panel" id="notifPanel" hidden>
          <div class="notif-panel-title">알림</div>
          <div class="notif-list" id="notifList">
            <div class="notif-empty">새 알림이 없습니다</div>
          </div>
        </div>
      </div>

      <a class="user-avatar-link" id="userAvatar" data-auth="in" href="mypage.html" hidden
         aria-label="마이페이지">?</a>

      <button class="btn btn-danger" id="btnLogout" data-auth="in" hidden>로그아웃</button>

      <!-- 비로그인 시 -->
      <button class="btn" data-auth="out" id="btnOpenLogin" hidden>로그인</button>

    </nav>

  </div>
</header>
