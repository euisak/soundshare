<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundShare — 게시글</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <script src="js/header-loader.js"></script>

    <main class="container">
      <div id="notice" class="notice" hidden></div>
      <div id="postArea"></div>
    </main>


    <script src="config.js"></script>
    <script type="module">
      import { loadHeader, initTopbar, getUrlParam, setNotice } from "./js/app.js";
      import { auth, onAuthStateChanged } from "./js/firebase.js";
      import { getPost, toggleLike, toggleSave, addComment, listenComments, deletePost } from "./js/post.js";
      import { renderTrackCard, renderChips, renderComment, timeAgo, escHtml, avatarLetter, showToast } from "./js/ui.js";

      await loadHeader();
      initTopbar();

      const postId = getUrlParam("id") || window.location.hash.slice(1);
      if (!postId) {
        document.querySelector("#postArea").innerHTML = '<div class="card empty-state">게시글 ID가 없습니다.</div>';
        throw new Error("no postId");
      }

      const post = await getPost(postId).catch((err) => { console.error("getPost error:", err, postId); return null; });
      if (!post) {
        document.querySelector("#postArea").innerHTML = '<div class="card empty-state">게시글을 찾을 수 없습니다.</div>';
        throw new Error("post not found");
      }

      document.title = `${post.title} — SoundShare`;

      // ── 게시글 렌더 ─────────────────────────────────────────────────────────
      const user = await new Promise((resolve) => {
        const unsub = onAuthStateChanged(auth, (u) => { unsub(); resolve(u); });
      });

      const isOwner = user && user.uid === post.authorId;
      const liked = user && (post.likedBy || []).includes(user.uid);
      const saved = user && (post.savedBy || []).includes(user.uid);

      document.querySelector("#postArea").innerHTML = `
        <article class="card post-card" style="margin-bottom:16px">
          <div class="post-meta">
            <span class="post-author-avatar">${avatarLetter(post.authorName)}</span>
            <span>${escHtml(post.authorName)}</span>
            <span class="muted">·</span>
            <span class="muted">${timeAgo(post.createdAt)}</span>
            ${isOwner ? `<button class="btn btn-danger" id="btnDelete" style="margin-left:auto;padding:5px 10px;font-size:12px">삭제</button>` : ""}
          </div>
          <h1 class="post-title" style="font-size:22px">${escHtml(post.title)}</h1>
          ${post.body ? `<p style="line-height:1.75;color:var(--muted);white-space:pre-wrap">${escHtml(post.body)}</p>` : ""}
          ${(post.tracks?.length ? post.tracks : post.track ? [post.track] : []).map((t) => renderTrackCard(t)).join("")}
          ${renderChips(post.genre)}${renderChips(post.tags, "tag")}

          <div class="action-bar" style="margin-top:8px">
            <button class="action-btn ${liked ? "liked" : ""}" id="btnLike">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="${liked ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
              <span id="likeCount">${post.likeCount || 0}</span>
            </button>
            <button class="action-btn ${saved ? "saved" : ""}" id="btnSave">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="${saved ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
              </svg>
              ${saved ? "저장됨" : "저장"}
            </button>
          </div>
        </article>

        <!-- 댓글 -->
        <section class="card">
          <div class="section-title">댓글 <span id="commentCount" class="muted small">${post.commentCount || 0}</span></div>
          <div class="comment-list" id="commentList"><div class="muted small">댓글을 불러오는 중…</div></div>

          ${user ? `
          <form id="formComment" style="display:flex;gap:8px;margin-top:14px">
            <input class="input" id="commentInput" placeholder="댓글을 입력하세요…" style="flex:1" />
            <button class="btn primary" type="submit">등록</button>
          </form>` : `<p class="muted small" style="margin-top:12px"><a href="login.html" style="color:var(--brand)">로그인</a>하면 댓글을 달 수 있습니다.</p>`}
        </section>`;

      // ── 오디오 미리듣기 ─────────────────────────────────────────────────────
      const audio = document.querySelector("#previewAudio");
      const btnPreview = document.querySelector("#btnPreview");
      if (audio && btnPreview) {
        btnPreview.addEventListener("click", () => {
          if (audio.paused) {
            audio.play();
            btnPreview.classList.add("playing");
            btnPreview.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
          } else {
            audio.pause();
            btnPreview.classList.remove("playing");
            btnPreview.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
          }
        });
        audio.addEventListener("ended", () => {
          btnPreview.classList.remove("playing");
          btnPreview.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
        });
      }

      // ── 좋아요 ──────────────────────────────────────────────────────────────
      document.querySelector("#btnLike")?.addEventListener("click", async () => {
        if (!user) { showToast("로그인이 필요합니다.", "danger"); return; }
        const btn = document.querySelector("#btnLike");
        btn.disabled = true;
        try {
          const nowLiked = await toggleLike(postId);
          const count = document.querySelector("#likeCount");
          count.textContent = parseInt(count.textContent) + (nowLiked ? 1 : -1);
          btn.classList.toggle("liked", nowLiked);
          btn.querySelector("svg").setAttribute("fill", nowLiked ? "currentColor" : "none");
        } finally { btn.disabled = false; }
      });

      // ── 저장 ────────────────────────────────────────────────────────────────
      document.querySelector("#btnSave")?.addEventListener("click", async () => {
        if (!user) { showToast("로그인이 필요합니다.", "danger"); return; }
        const btn = document.querySelector("#btnSave");
        btn.disabled = true;
        try {
          const nowSaved = await toggleSave(postId);
          btn.classList.toggle("saved", nowSaved);
          btn.querySelector("svg").setAttribute("fill", nowSaved ? "currentColor" : "none");
          btn.childNodes[btn.childNodes.length - 1].textContent = nowSaved ? "저장됨" : "저장";
          showToast(nowSaved ? "저장되었습니다." : "저장이 해제되었습니다.");
        } finally { btn.disabled = false; }
      });


      // ── 삭제 ────────────────────────────────────────────────────────────────
      document.querySelector("#btnDelete")?.addEventListener("click", async () => {
        if (!confirm("게시글을 삭제할까요?")) return;
        try {
          await deletePost(postId);
          showToast("삭제되었습니다.");
          setTimeout(() => { window.location.href = "index.html"; }, 1000);
        } catch (err) {
          showToast(err.message, "danger");
        }
      });

      // ── 댓글 실시간 ─────────────────────────────────────────────────────────
      listenComments(postId, (comments) => {
        const list = document.querySelector("#commentList");
        const cnt = document.querySelector("#commentCount");
        if (cnt) cnt.textContent = comments.length;
        list.innerHTML = comments.length
          ? comments.map(renderComment).join("")
          : '<div class="muted small">아직 댓글이 없습니다.</div>';
      });

      document.querySelector("#formComment")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const input = document.querySelector("#commentInput");
        const text = input.value.trim();
        if (!text) return;
        const btn = e.target.querySelector("[type=submit]");
        btn.disabled = true;
        try {
          await addComment(postId, text);
          input.value = "";
        } catch (err) {
          showToast(err.message, "danger");
        } finally {
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
