<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundShare — 게시글</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <script src="js/header-loader.js"></script>

    <main class="container">
      <div id="notice" class="notice" hidden></div>
      <button class="back-btn" onclick="history.length > 1 ? history.back() : location.href='index.html'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
        뒤로
      </button>
      <div id="postArea"></div>
    </main>


    <script src="config.js"></script>
    <script type="module">
      import { loadHeader, initTopbar, getUrlParam, setNotice } from "./js/app.js";
      import { auth, onAuthStateChanged } from "./js/firebase.js";
      import { getPost, toggleLike, addComment, listenComments, deletePost, incrementViewCount, updateComment, deleteComment } from "./js/post.js";
      import { renderTrackCard, renderChips, renderComment, timeAgo, escHtml, avatarLetter, showToast, resolveAvatars } from "./js/ui.js";

      await loadHeader();
      initTopbar();

      const postId = getUrlParam("id") || window.location.hash.slice(1);
      if (!postId) {
        document.querySelector("#postArea").innerHTML = '<div class="card empty-state">게시글 ID가 없습니다.</div>';
        throw new Error("no postId");
      }

      const post = await getPost(postId).catch((err) => { console.error("getPost error:", err, postId); return null; });
      incrementViewCount(postId);
      if (!post) {
        document.querySelector("#postArea").innerHTML = '<div class="card empty-state">게시글을 찾을 수 없습니다.</div>';
        throw new Error("post not found");
      }

      document.title = `${post.title} — SoundShare`;

      // ── 게시글 렌더 ─────────────────────────────────────────────────────────
      const user = await new Promise((resolve) => {
        const unsub = onAuthStateChanged(auth, (u) => { unsub(); resolve(u); });
      });

      const isOwner = user && user.uid === post.authorId;
      const liked = user && (post.likedBy || []).includes(user.uid);

      document.querySelector("#postArea").innerHTML = `
        <article class="card post-card" style="margin-bottom:16px">
          <div class="post-meta">
            <span class="post-author-avatar" data-uid="${escHtml(post.authorId)}">${avatarLetter(post.authorName)}</span>
            <span>${escHtml(post.authorName)}</span>
            <span class="muted">·</span>
            <span class="muted">${timeAgo(post.createdAt)}</span>
            ${isOwner ? `
              <div class="post-list-more-wrap" style="margin-left:auto">
                <button class="post-list-more-btn" id="btnPostMore" aria-label="게시글 메뉴">⋮</button>
                <div class="post-list-dropdown" id="postMoreDropdown" hidden>
                  <a class="post-list-dropdown-item" href="write.html#${post.id}">수정</a>
                  <button class="post-list-dropdown-item danger" id="btnDelete">삭제</button>
                </div>
              </div>` : ""}
          </div>
          <h1 class="post-title" style="font-size:22px">${escHtml(post.title)}</h1>
          ${post.body ? `<p style="line-height:1.75;color:var(--muted);white-space:pre-wrap">${escHtml(post.body)}</p>` : ""}
          ${(post.tracks?.length ? post.tracks : post.track ? [post.track] : []).map((t) => renderTrackCard(t)).join("")}
          ${renderChips(post.genre)}${renderChips(post.tags, "tag")}

          <div class="action-bar" style="margin-top:8px">
            <button class="action-btn ${liked ? "liked" : ""}" id="btnLike">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="${liked ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
              <span id="likeCount">${post.likeCount || 0}</span>
            </button>
            <span class="action-btn" style="cursor:default;pointer-events:none">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              ${(post.viewCount || 0) + 1}
            </span>
          </div>
        </article>

        <!-- 댓글 -->
        <section class="card">
          <div class="section-title">댓글 <span id="commentCount" class="muted small">${post.commentCount || 0}</span></div>
          <div class="comment-list" id="commentList"><div class="muted small">댓글을 불러오는 중…</div></div>

          ${user ? `
          <form id="formComment" style="display:flex;gap:8px;margin-top:14px">
            <input class="input" id="commentInput" placeholder="댓글을 입력하세요…" style="flex:1" />
            <button class="btn primary" type="submit">등록</button>
          </form>` : `<p class="muted small" style="margin-top:12px"><a href="login.html" style="color:var(--brand)">로그인</a>하면 댓글을 달 수 있습니다.</p>`}
        </section>`;

      // 게시글 작성자 프로필 사진 로드
      resolveAvatars(document.querySelector("#postArea"));

      // ── 오디오 미리듣기 ─────────────────────────────────────────────────────
      const audio = document.querySelector("#previewAudio");
      const btnPreview = document.querySelector("#btnPreview");
      if (audio && btnPreview) {
        btnPreview.addEventListener("click", () => {
          if (audio.paused) {
            audio.play();
            btnPreview.classList.add("playing");
            btnPreview.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
          } else {
            audio.pause();
            btnPreview.classList.remove("playing");
            btnPreview.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
          }
        });
        audio.addEventListener("ended", () => {
          btnPreview.classList.remove("playing");
          btnPreview.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
        });
      }

      // ── 좋아요 ──────────────────────────────────────────────────────────────
      document.querySelector("#btnLike")?.addEventListener("click", async () => {
        if (!user) { showToast("로그인이 필요합니다.", "danger"); return; }
        const btn = document.querySelector("#btnLike");
        btn.disabled = true;
        try {
          const nowLiked = await toggleLike(postId);
          const count = document.querySelector("#likeCount");
          count.textContent = parseInt(count.textContent) + (nowLiked ? 1 : -1);
          btn.classList.toggle("liked", nowLiked);
          btn.querySelector("svg").setAttribute("fill", nowLiked ? "currentColor" : "none");
        } finally { btn.disabled = false; }
      });



      // ── 게시글 ⋮ 토글 ───────────────────────────────────────────────────────
      document.querySelector("#btnPostMore")?.addEventListener("click", (e) => {
        e.stopPropagation();
        const dd = document.querySelector("#postMoreDropdown");
        dd.hidden = !dd.hidden;
      });

      // ── 삭제 ────────────────────────────────────────────────────────────────
      document.querySelector("#btnDelete")?.addEventListener("click", async () => {
        if (!confirm("게시글을 삭제할까요?")) return;
        try {
          await deletePost(postId);
          showToast("삭제되었습니다.");
          setTimeout(() => { window.location.href = "index.html"; }, 1000);
        } catch (err) {
          showToast(err.message, "danger");
        }
      });

      // ── 댓글 실시간 ─────────────────────────────────────────────────────────
      listenComments(postId, (comments) => {
        const list = document.querySelector("#commentList");
        const cnt  = document.querySelector("#commentCount");
        if (cnt) cnt.textContent = comments.length;
        list.innerHTML = comments.length
          ? comments.map((c) => renderComment(c, user?.uid)).join("")
          : '<div class="muted small">아직 댓글이 없습니다.</div>';
        resolveAvatars(list); // 댓글 작성자 프로필 사진 로드
      });

      // ── 댓글 ⋮ / 수정 / 삭제 ────────────────────────────────────────────────
      document.querySelector("#commentList").addEventListener("click", async (e) => {

        // ⋮ 토글
        const moreBtn = e.target.closest(".comment-more-btn");
        if (moreBtn) {
          e.stopPropagation();
          const cid = moreBtn.dataset.commentId;
          const dd  = document.querySelector(`.post-list-dropdown[data-comment-id="${cid}"]`);
          document.querySelectorAll(".post-list-dropdown:not([hidden])").forEach((d) => { if (d !== dd) d.hidden = true; });
          dd.hidden = !dd.hidden;
          return;
        }

        // 수정 폼 열기
        const editBtn = e.target.closest("[data-action='edit-comment']");
        if (editBtn) {
          const cid     = editBtn.dataset.commentId;
          const item    = document.querySelector(`.comment-item[data-id="${cid}"]`);
          const textEl  = item.querySelector(".comment-text");
          const origTxt = textEl.dataset.text;
          document.querySelectorAll(".post-list-dropdown:not([hidden])").forEach((d) => d.hidden = true);
          textEl.innerHTML = `
            <textarea class="input" style="width:100%;min-height:64px;resize:vertical;font-size:13px;padding:8px 10px">${escHtml(origTxt)}</textarea>
            <div style="display:flex;gap:6px;margin-top:8px">
              <button class="btn primary" data-action="save-comment-post"
                      data-comment-id="${escHtml(cid)}"
                      style="font-size:12px;padding:5px 12px">저장</button>
              <button class="btn" data-action="cancel-edit-comment-post"
                      data-comment-id="${escHtml(cid)}"
                      style="font-size:12px;padding:5px 12px">취소</button>
            </div>`;
          textEl.querySelector("textarea").focus();
          return;
        }

        // 수정 저장
        const saveBtn = e.target.closest("[data-action='save-comment-post']");
        if (saveBtn) {
          const cid     = saveBtn.dataset.commentId;
          const item    = document.querySelector(`.comment-item[data-id="${cid}"]`);
          const textEl  = item.querySelector(".comment-text");
          const newText = textEl.querySelector("textarea").value.trim();
          if (!newText) { showToast("내용을 입력해주세요.", "danger"); return; }
          saveBtn.disabled = true;
          saveBtn.textContent = "저장 중…";
          try {
            await updateComment(postId, cid, newText);
            // listenComments 가 자동으로 DOM 갱신
          } catch (err) {
            showToast(err.message, "danger");
            saveBtn.disabled = false;
            saveBtn.textContent = "저장";
          }
          return;
        }

        // 수정 취소
        const cancelBtn = e.target.closest("[data-action='cancel-edit-comment-post']");
        if (cancelBtn) {
          const cid    = cancelBtn.dataset.commentId;
          const item   = document.querySelector(`.comment-item[data-id="${cid}"]`);
          const textEl = item.querySelector(".comment-text");
          textEl.innerHTML = escHtml(textEl.dataset.text);
          return;
        }

        // 삭제
        const delBtn = e.target.closest("[data-action='delete-comment']");
        if (delBtn) {
          if (!confirm("댓글을 삭제할까요?")) return;
          const cid = delBtn.dataset.commentId;
          try {
            await deleteComment(postId, cid);
            // listenComments 가 자동으로 DOM 갱신
          } catch (err) {
            showToast(err.message, "danger");
          }
          return;
        }
      });

      // ⋮ 외부 클릭 시 닫기
      document.addEventListener("click", () => {
        document.querySelectorAll(".post-list-dropdown:not([hidden])").forEach((d) => d.hidden = true);
      });

      document.querySelector("#formComment")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const input = document.querySelector("#commentInput");
        const text = input.value.trim();
        if (!text) return;
        const btn = e.target.querySelector("[type=submit]");
        btn.disabled = true;
        try {
          await addComment(postId, text);
          input.value = "";
        } catch (err) {
          showToast(err.message, "danger");
        } finally {
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
