<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundShare — 검색</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/search.css" />
  </head>
  <body>
    <script src="js/header-loader.js"></script>

    <main class="container">
      <div id="notice" class="notice" hidden></div>

      <div class="search-form-wrap">
        <form id="formSearch" class="search-form">
          <input id="searchInput" class="input" type="search"
            placeholder="게시글 제목, 가수, 노래 제목 검색…" />
          <button class="btn primary" type="submit">검색</button>
        </form>

        <!-- 검색 조건 필터 (검색 결과 표시 시) -->
        <div id="searchFieldWrap" hidden>
          <div class="chips search-field-chips" id="searchFieldChips">
            <span class="muted small search-field-label">검색 조건</span>
            <button class="chip active" data-field="title" type="button">게시글 제목</button>
            <button class="chip active" data-field="artist" type="button">가수</button>
            <button class="chip active" data-field="song" type="button">노래 제목</button>
          </div>
        </div>

        <div id="searchMeta" class="muted small search-meta"></div>
      </div>

      <div class="grid" id="results"></div>
    </main>

    <script src="config.js"></script>
    <script type="module" src="js/search-page.js"></script>
  </body>
</html>
