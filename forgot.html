<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundShare — 비밀번호 찾기</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <script src="js/header-loader.js"></script>

    <main class="container">
      <div id="notice" class="notice" hidden></div>

      <div style="max-width:400px;margin:0 auto">
        <section class="card">
          <h1 class="title">비밀번호 찾기</h1>
          <p class="subtitle" style="margin-bottom:16px">
            가입한 이메일 주소를 입력하면 재설정 링크를 보내드립니다.
          </p>
          <form id="formForgot" class="stack">
            <div>
              <label for="forgotEmail">이메일</label>
              <input id="forgotEmail" class="input" type="email" autocomplete="email" placeholder="example@email.com" />
            </div>
            <button class="btn primary" type="submit">재설정 메일 보내기</button>
          </form>
          <p class="muted small" style="margin-top:14px;text-align:center">
            <a href="login.html" style="color:var(--brand)">← 로그인으로 돌아가기</a>
          </p>
        </section>
      </div>
    </main>

    <script src="config.js"></script>
    <script type="module">
      import { loadHeader, initTopbar } from "./js/app.js";
      import { initAuthPage } from "./js/auth.js";
      await loadHeader();
      initTopbar();
      initAuthPage();
    </script>
  </body>
</html>
