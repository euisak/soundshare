<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundShare — 로그인</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <script src="js/header-loader.js"></script>

    <main class="container">
      <div id="notice" class="notice" hidden></div>

      <div class="grid" style="grid-template-columns: 1fr; margin-top: 14px">
        <section class="card">
          <h1 class="title">로그인</h1>
          <form id="formLogin" class="stack">
            <div>
              <label for="loginEmail">이메일</label>
              <input id="loginEmail" class="input" type="email" autocomplete="email" placeholder="example@email.com" />
            </div>
            <div>
              <label for="loginPassword">비밀번호</label>
              <input
                id="loginPassword"
                class="input"
                type="password"
                autocomplete="current-password"
                placeholder="6자 이상"
              />
            </div>
            <button class="btn primary" type="submit">로그인</button>
          </form>
          <p class="muted small" style="margin-top:10px;text-align:right">
            <a href="forgot.html" style="color:var(--brand)">비밀번호를 잊으셨나요?</a>
          </p>
        </section>

        <section class="card">
          <h2 class="title">회원가입</h2>
          <form id="formRegister" class="stack">
            <div>
              <label for="regNickname">닉네임</label>
              <input id="regNickname" class="input" type="text" autocomplete="nickname" placeholder="다른 유저에게 보이는 이름" />
            </div>
            <div>
              <label for="regEmail">이메일</label>
              <input id="regEmail" class="input" type="email" autocomplete="email" placeholder="example@email.com" />
            </div>
            <div>
              <label for="regPassword">비밀번호</label>
              <input
                id="regPassword"
                class="input"
                type="password"
                autocomplete="new-password"
                placeholder="6자 이상"
              />
            </div>
            <button class="btn primary" type="submit">회원가입</button>
          </form>
        </section>
      </div>
    </main>

    <script src="config.js"></script>
    <script type="module">
      import { loadHeader, initTopbar } from "./js/app.js";
      import { initAuthPage } from "./js/auth.js";
      await loadHeader();
      initTopbar();
      initAuthPage();
    </script>
  </body>
</html>
