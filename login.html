<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- 직접 접근 시 메인으로 이동 (fetch로 불러올 땐 스크립트 실행 안 됨) -->
  <script>window.location.replace('index.html');</script>
</head>
<body>

<!-- ── Auth Modal ──────────────────────────────────────────────── -->
<!-- header-loader.js 가 이 파일을 fetch 해서 #authModal 만 body에 삽입 -->
<div id="authModal" class="auth-modal-backdrop" hidden>
  <div class="auth-modal-box">
    <button class="auth-modal-close" id="btnCloseAuth" aria-label="닫기"> <!-- 닫기 버튼 -->
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </button>

    <div id="authNotice" class="notice notice--mb" hidden></div> <!-- 로그인/가입 에러 -->

    <!-- 로그인 뷰 -->
    <div id="authViewLogin">
      <h2 class="auth-modal-title">로그인</h2>
      <form id="formLogin" class="stack" novalidate>
        <div>
          <label for="loginEmail">이메일</label>
          <input id="loginEmail" class="input" type="email" autocomplete="email"
                 placeholder="이메일" maxlength="100" />
        </div>
        <div>
          <label for="loginPassword">비밀번호</label>
          <input id="loginPassword" class="input" type="password" autocomplete="current-password"
                 placeholder="비밀번호" maxlength="30" />
        </div>
        <button class="btn primary" type="submit">로그인</button>
      </form>
      <p class="muted small auth-footer">
        <button class="auth-view-btn" data-to="forgot">비밀번호 찾기</button>
        <span class="auth-sep">|</span>
        <button class="auth-view-btn" data-to="register">회원가입</button>
      </p>
    </div>

    <!-- 회원가입 뷰 (data-to="register" 클릭 시 표시) -->
    <div id="authViewRegister" hidden>
      <h2 class="auth-modal-title">회원가입</h2>
      <form id="formRegister" class="stack" novalidate>
        <div>
          <label for="regNickname">닉네임 <span class="muted small">(최대 10자)</span></label>
          <div class="input-with-btn">
            <input id="regNickname" class="input" type="text" autocomplete="nickname"
                   placeholder="다른 유저에게 보이는 이름" maxlength="10" />
            <button type="button" class="btn btn-shrink" id="btnCheckNickname">중복확인</button>
          </div>
          <span id="nicknameStatus" class="small status-hint"></span>
        </div>
        <div>
          <label for="regEmail">이메일</label>
          <input id="regEmail" class="input" type="email" autocomplete="email"
                 placeholder="이메일" maxlength="100" />
          <span id="emailStatus" class="small status-hint"></span>
        </div>
        <div>
          <label for="regPassword">비밀번호 <span class="muted small">(특수기호 포함 8~30자)</span></label>
          <input id="regPassword" class="input" type="password" autocomplete="new-password"
                 placeholder="비밀번호" maxlength="30" />
        </div>
        <div>
          <label for="regPasswordConfirm">비밀번호 확인</label>
          <input id="regPasswordConfirm" class="input" type="password" autocomplete="new-password"
                 placeholder="비밀번호를 한 번 더 입력해주세요" maxlength="30" />
          <span id="passwordConfirmStatus" class="small status-hint"></span>
        </div>
        <button class="btn primary" id="btnRegister" type="submit" disabled>회원가입</button>
      </form>
      <p class="muted small auth-footer">
        이미 계정이 있으신가요?
        <button class="auth-view-btn" data-to="login">로그인</button>
      </p>
    </div>

    <!-- 비밀번호 찾기 뷰 (data-to="forgot" 클릭 시 표시) -->
    <div id="authViewForgot" hidden>
      <h2 class="auth-modal-title">비밀번호 찾기</h2>
      <p class="muted small notice--mb">가입한 이메일로 재설정 링크를 보내드립니다.</p>
      <form id="formForgot" class="stack" novalidate>
        <div>
          <label for="forgotEmail">이메일</label>
          <input id="forgotEmail" class="input" type="email" autocomplete="email"
                 placeholder="이메일" maxlength="100" />
        </div>
        <button class="btn primary" type="submit">재설정 메일 보내기</button>
      </form>
      <p class="muted small auth-footer">
        <button class="auth-view-btn" data-to="login">← 로그인으로 돌아가기</button>
      </p>
    </div>

  </div>
</div>

</body>
</html>
