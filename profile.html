<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundShare — 프로필</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/feed.css" />
    <link rel="stylesheet" href="css/profile.css" />
  </head>
  <body>
    <script src="js/header-loader.js"></script>

    <main class="pd-page">
      <button class="back-btn" onclick="history.length > 1 ? history.back() : location.href='index.html'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
        뒤로
      </button>

      <!-- 프로필 헤더 -->
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:28px;flex-wrap:wrap">
        <div id="profileAvatar" class="post-author-avatar"
             style="width:56px;height:56px;font-size:22px;flex-shrink:0">?</div>
        <div style="flex:1;min-width:0">
          <div id="profileName" style="font-size:20px;font-weight:700;letter-spacing:-0.02em">-</div>
        </div>
        <a class="btn" href="settings.html" id="btnSettings" hidden>설정</a>
      </div>

      <!-- 탭 -->
      <div class="tabs" id="tabNav">
        <button class="tab-btn active" data-tab="posts">작성한 글</button>
        <button class="tab-btn" data-tab="comments">작성한 댓글</button>
      </div>

      <div id="tabContent"></div>
    </main>

    <script src="config.js"></script>
    <script type="module">
      import { loadHeader, initTopbar } from "./js/app.js";
      import { auth, onAuthStateChanged, db, getDoc, doc } from "./js/firebase.js";
      import { getUserPosts, getCommentedPosts } from "./js/post.js";
      import { avatarLetter, timeAgo, escHtml, resolveAvatars } from "./js/ui.js";

      await loadHeader();
      initTopbar();

      const uid = window.location.hash.slice(1);
      const tabContent = document.querySelector("#tabContent");

      if (!uid || uid === "undefined" || uid === "null") {
        tabContent.innerHTML = '<div class="muted small" style="text-align:center;padding:40px 0">사용자를 찾을 수 없습니다.</div>';
      } else {
        const currentUser = await new Promise((resolve) => {
          const unsub = onAuthStateChanged(auth, (u) => { unsub(); resolve(u); });
        });
        const isOwn = currentUser && currentUser.uid === uid;

        if (isOwn) document.querySelector("#btnSettings").hidden = false;

        const userSnap = await getDoc(doc(db, "users", uid)).catch(() => null);
        const userData       = userSnap?.exists() ? userSnap.data() : {};
        const postsPublic    = userData.postsPublic    !== false;
        const commentsPublic = userData.commentsPublic !== false;

        let displayName = userData.nickname || userData.email?.split("@")[0] || "";
        if (!displayName) {
          const fallbackPosts = await getUserPosts(uid).catch(() => []);
          displayName = fallbackPosts[0]?.authorName || "알 수 없음";
        }

        document.title = `${displayName} — SoundShare`;
        const avatarEl = document.querySelector("#profileAvatar");
        avatarEl.textContent = avatarLetter(displayName);
        if (userData.photoURL) {
          avatarEl.innerHTML = `<img src="${userData.photoURL}" alt="프로필" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`;
        }
        document.querySelector("#profileName").textContent = displayName;

        const PER_PAGE = 10;
        const cache     = {};
        const pageState = { posts: 1, comments: 1 };
        let   activeTab = "posts";

        function buildCover(tracks) {
          const items = (tracks || []).slice(0, 5);
          let html = '<div class="post-cover-stack">';
          for (let i = 0; i < 5; i++) {
            const t = items[i];
            html += t?.albumArt
              ? `<img class="post-cover-stack-img" src="${escHtml(t.albumArt)}" alt="" />`
              : `<div class="post-cover-stack-empty"></div>`;
          }
          return html + '</div>';
        }

        function renderPostItem(post) {
          const pid = escHtml(post.id);
          const tracks = Array.isArray(post.tracks) ? post.tracks : (post.track ? [post.track] : []);
          const tags = (post.tags || []).slice(0, 3);
          const tagsHtml = tags.length
            ? `<div class="post-feed-tags">${tags.map(t => `<span class="post-feed-tag">${escHtml(t)}</span>`).join("")}</div>`
            : "";
          const rawBody = (post.body || "").replace(/<br\s*\/?>/gi, " ").replace(/<[^>]+>/g, "").trim();
          const bodyHtml = rawBody ? `<div class="post-feed-body-text">${escHtml(rawBody)}</div>` : "";
          return `
          <a class="post-feed-card" href="post.html#${pid}">
            ${buildCover(tracks)}
            <div class="post-feed-body">
              <div class="post-feed-title">${escHtml(post.title)}</div>
              <div class="post-feed-author-row">
                <span class="post-feed-time">${timeAgo(post.createdAt)}</span>
                ${post.visibility === "private" ? `<span class="post-feed-time">· 비공개</span>` : ""}
              </div>
              ${bodyHtml}
              <div class="post-feed-footer">
                ${tagsHtml}
                <div class="post-feed-stats">
                  <span class="post-feed-stat">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                    ${post.likeCount || 0}
                  </span>
                  <span class="post-feed-stat">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    ${post.commentCount || 0}
                  </span>
                  <span class="post-feed-stat">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    ${post.viewCount || 0}
                  </span>
                </div>
              </div>
            </div>
          </a>`;
        }

        function renderCommentedItem({ post, comment }) {
          const pid = escHtml(post.id);
          return `
          <div style="display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)">
            <div style="flex:1;min-width:0;overflow:hidden">
              <a class="post-list-title-link" href="post.html#${pid}"
                 style="display:block;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
                ${escHtml(post.title)}
              </a>
              <div class="post-list-comment-text"
                   style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
                ${escHtml(comment.text)}
              </div>
            </div>
            <span class="post-list-time" style="flex-shrink:0">${timeAgo(post.createdAt)}</span>
          </div>`;
        }

        function renderPagination(total, page, tab) {
          const totalPages = Math.ceil(total / PER_PAGE);
          if (totalPages <= 1) return "";
          const prev = `<button class="rd-page-btn" data-page="${page - 1}" data-tab="${tab}"${page === 1 ? " disabled" : ""}>‹</button>`;
          const next = `<button class="rd-page-btn" data-page="${page + 1}" data-tab="${tab}"${page === totalPages ? " disabled" : ""}>›</button>`;
          let nums = "", prevN = 0;
          for (let i = 1; i <= totalPages; i++) {
            if (i === 1 || i === totalPages || Math.abs(i - page) <= 2) {
              if (prevN && i - prevN > 1) nums += `<span style="padding:0 4px;color:var(--muted)">…</span>`;
              nums += `<button class="rd-page-btn${i === page ? " active" : ""}" data-page="${i}" data-tab="${tab}">${i}</button>`;
              prevN = i;
            }
          }
          return `<div class="rd-pagination" style="display:flex;align-items:center;justify-content:center;gap:4px;margin-top:20px">${prev}${nums}${next}</div>`;
        }

        function renderTab(tab) {
          const data = cache[tab];
          const page = pageState[tab];
          if (!data || !data.length) {
            tabContent.innerHTML = `<div class="muted small" style="text-align:center;padding:40px 0">${tab === "posts" ? "작성한 글이 없습니다." : "작성한 댓글이 없습니다."}</div>`;
            return;
          }
          const slice = data.slice((page - 1) * PER_PAGE, page * PER_PAGE);
          const items = tab === "comments"
            ? `<div style="border-top:1px solid var(--line)">${slice.map(renderCommentedItem).join("")}</div>`
            : slice.map(renderPostItem).join("");
          tabContent.innerHTML = items + renderPagination(data.length, page, tab);
          resolveAvatars(tabContent);
        }

        async function loadTab(tab) {
          activeTab = tab;
          if (tab === "posts" && !postsPublic && !isOwn) {
            tabContent.innerHTML = '<div class="muted small" style="text-align:center;padding:40px 0">비공개 처리된 게시글입니다.</div>';
            return;
          }
          if (tab === "comments" && !commentsPublic && !isOwn) {
            tabContent.innerHTML = '<div class="muted small" style="text-align:center;padding:40px 0">비공개 처리된 댓글입니다.</div>';
            return;
          }
          tabContent.innerHTML = '<div class="skeleton" style="height:200px;border-radius:12px"></div>';
          try {
            if (!(tab in cache)) {
              if (tab === "posts") {
                const posts = await getUserPosts(uid);
                cache[tab] = isOwn ? posts : posts.filter(p => p.visibility !== "private");
              } else {
                const commented = await getCommentedPosts(uid);
                cache[tab] = isOwn ? commented : commented.filter(({ post }) => post.visibility !== "private");
              }
            }
            renderTab(tab);
          } catch (err) {
            tabContent.innerHTML = `<div class="muted small" style="text-align:center;padding:40px 0">${escHtml(err.message)}</div>`;
          }
        }

        document.querySelector("#tabNav").addEventListener("click", (e) => {
          const btn = e.target.closest(".tab-btn");
          if (!btn || btn.dataset.tab === activeTab) return;
          document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          loadTab(btn.dataset.tab);
        });

        tabContent.addEventListener("click", (e) => {
          const pageBtn = e.target.closest(".rd-page-btn[data-page]");
          if (pageBtn && !pageBtn.disabled) {
            pageState[pageBtn.dataset.tab] = Number(pageBtn.dataset.page);
            renderTab(activeTab);
            document.querySelector("#tabNav").scrollIntoView({ behavior: "smooth", block: "start" });
          }
        });

        await loadTab("posts");

        // bfcache 복원 시 그대로 유지
      }
    </script>
  </body>
</html>
