<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundShare — 글쓰기</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <script src="js/header-loader.js"></script>

    <main class="container">
      <div id="notice" class="notice" hidden></div>

      <section class="card">
        <h1 class="title">추천 글 작성</h1>

        <form id="formWrite" class="stack" style="margin-top:14px">

          <!-- 제목 (최대 50자) -->
          <div>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <label for="postTitle" style="margin:0">제목 <span style="color:var(--danger)">*</span></label>
              <span class="muted small"><span id="titleCount">0</span>/50</span>
            </div>
            <input id="postTitle" class="input" type="text" maxlength="50"
              placeholder="어떤 곡을 추천하고 싶으신가요?" style="margin-top:6px" />
          </div>

          <!-- 본문 (최대 1000자) -->
          <div>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <label for="postBody" style="margin:0">추천 이유</label>
              <span class="muted small"><span id="bodyCount">0</span>/1000</span>
            </div>
            <textarea id="postBody" class="input" rows="5" maxlength="1000"
              placeholder="이 곡을 추천하는 이유, 어울리는 순간, 감상 포인트를 적어보세요."
              style="margin-top:6px"></textarea>
          </div>

          <!-- 노래 첨부 (최대 5곡) -->
          <div>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <label style="margin:0">노래 첨부 <span class="muted small">(최대 5곡)</span></label>
              <span class="muted small" id="trackCountBadge">0 / 5</span>
            </div>

            <!-- 첨부된 트랙 목록 -->
            <div id="trackList" style="display:flex;flex-direction:column;gap:8px;margin-top:8px"></div>

            <!-- 검색 영역 (5곡 미만일 때만 표시) -->
            <div id="trackSearchArea" style="margin-top:8px">
              <div class="track-search-wrap">
                <div style="display:flex;gap:8px">
                  <input id="trackSearchInput" class="input" type="search"
                    placeholder="곡 제목 또는 아티스트 검색…" autocomplete="off" />
                </div>
                <div class="track-dropdown" id="trackDropdown" hidden></div>
              </div>
              <p class="muted small" id="spotifyHint" style="margin-top:6px" hidden>
                Spotify 연결 후 트랙을 검색할 수 있습니다.
                <a href="index.html" style="color:var(--brand)">연결하기</a>
              </p>
            </div>
          </div>

          <!-- 장르 태그 (노래 선택 시 자동 설정) -->
          <div>
            <label style="margin:0 0 8px;display:block">장르 태그
              <span class="muted small">— 곡 선택 시 자동으로 설정됩니다</span>
            </label>
            <div class="genre-selector" id="genreSelector">
              <span class="muted small">곡을 선택하면 자동으로 설정됩니다</span>
            </div>
          </div>

          <!-- 감성/상황 태그 (수동 선택) -->
          <div>
            <label style="margin:0 0 6px">감성 / 상황 태그</label>
            <div class="genre-selector" id="moodSelector">
              <span class="genre-chip" data-mood="운동">💪 운동</span>
              <span class="genre-chip" data-mood="산책">🚶 산책</span>
              <span class="genre-chip" data-mood="드라이브">🚗 드라이브</span>
              <span class="genre-chip" data-mood="공부·집중">📚 공부·집중</span>
              <span class="genre-chip" data-mood="수면·휴식">😴 수면·휴식</span>
              <span class="genre-chip" data-mood="힐링">🌿 힐링</span>
              <span class="genre-chip" data-mood="새벽감성">🌙 새벽감성</span>
            </div>
          </div>

          <button class="btn primary" type="submit" id="btnSubmit">게시하기</button>
        </form>
      </section>
    </main>

    <script src="config.js"></script>
    <script type="module">
      import { loadHeader, initTopbar, requireAuth, setNotice } from "./js/app.js";
      import { createPost, updatePost, getPost } from "./js/post.js";
      import { searchTracksItunes } from "./js/music.js";
      import { escHtml, showToast } from "./js/ui.js";

      await loadHeader();
      initTopbar();
      await requireAuth();

      // 수정 모드: write.html#postId 형식으로 접근
      const editId = window.location.hash.slice(1) || null;

      // iTunes API 사용 — Spotify 연결 불필요
      document.querySelector("#spotifyHint").hidden = true;

      // ── 글자 수 카운터 ───────────────────────────────────────────────────────
      const titleInput = document.querySelector("#postTitle");
      const bodyInput = document.querySelector("#postBody");
      const titleCount = document.querySelector("#titleCount");
      const bodyCount = document.querySelector("#bodyCount");

      titleInput.addEventListener("input", () => {
        titleCount.textContent = titleInput.value.length;
      });
      bodyInput.addEventListener("input", () => {
        bodyCount.textContent = bodyInput.value.length;
      });

      // ── 장르 (트랙 genreName 기반 자동 설정) ───────────────────────────────────
      const selectedGenres = new Set();
      const genreSelector  = document.querySelector("#genreSelector");

      function renderGenreChips() {
        if (selectedGenres.size === 0) {
          genreSelector.innerHTML = '<span class="muted small">곡을 선택하면 자동으로 설정됩니다</span>';
        } else {
          genreSelector.innerHTML = [...selectedGenres]
            .map((g) => `<span class="genre-chip selected" style="pointer-events:none;cursor:default">${escHtml(g)}</span>`)
            .join("");
        }
      }

      // 선택된 트랙의 genreName(iTunes 원본)을 중복 없이 모아 칩으로 표시
      function updateAutoGenres() {
        selectedGenres.clear();
        selectedTracks.forEach((t) => {
          if (t.genreName) selectedGenres.add(t.genreName);
        });
        renderGenreChips();
      }

      // ── 감성/상황 태그 ────────────────────────────────────────────────────────
      const selectedMoods = new Set();
      document.querySelector("#moodSelector").addEventListener("click", (e) => {
        const chip = e.target.closest(".genre-chip");
        if (!chip) return;
        const m = chip.dataset.mood;
        if (selectedMoods.has(m)) { selectedMoods.delete(m); chip.classList.remove("selected"); }
        else { selectedMoods.add(m); chip.classList.add("selected"); }
      });

      // ── 트랙 목록 관리 ────────────────────────────────────────────────────────
      const MAX_TRACKS = 5;
      const selectedTracks = [];

      const trackListEl   = document.querySelector("#trackList");
      const trackBadge    = document.querySelector("#trackCountBadge");
      const trackSearchArea = document.querySelector("#trackSearchArea");

      function renderTrackList() {
        trackBadge.textContent = `${selectedTracks.length} / ${MAX_TRACKS}`;
        trackSearchArea.hidden = selectedTracks.length >= MAX_TRACKS;

        trackListEl.innerHTML = selectedTracks.map((t, i) => `
          <div class="track-card" style="gap:10px">
            ${t.albumArt
              ? `<img class="track-art" src="${escHtml(t.albumArt)}" alt="" />`
              : `<div class="track-art" style="background:rgba(109,124,255,.2);display:flex;align-items:center;justify-content:center">♪</div>`}
            <div class="track-info">
              <div class="track-name">${escHtml(t.name)}</div>
              <div class="track-artist">${escHtml(t.artist)}</div>
            </div>
            <button type="button" class="btn btn-danger"
              style="padding:5px 10px;font-size:12px;flex-shrink:0"
              data-remove="${i}">제거</button>
          </div>`).join("");
      }

      trackListEl.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-remove]");
        if (!btn) return;
        selectedTracks.splice(Number(btn.dataset.remove), 1);
        renderTrackList();
        updateAutoGenres(); // 트랙 제거 시 장르 재계산
      });

      // ── 트랙 검색 ─────────────────────────────────────────────────────────────
      let debounceTimer;
      const searchInput = document.querySelector("#trackSearchInput");
      const dropdown    = document.querySelector("#trackDropdown");

      searchInput.addEventListener("input", () => {
        clearTimeout(debounceTimer);
        const q = searchInput.value.trim();
        if (!q) { dropdown.hidden = true; return; }
        debounceTimer = setTimeout(() => doSearch(q), 400);
      });

      async function doSearch(q) {
        dropdown.innerHTML = '<div style="padding:12px;color:var(--muted);font-size:13px">검색 중…</div>';
        dropdown.hidden = false;
        try {
          const tracks = await searchTracksItunes(q);
          if (!tracks.length) {
            dropdown.innerHTML = '<div style="padding:12px;color:var(--muted);font-size:13px">결과 없음</div>';
            return;
          }
          // 이미 선택된 곡 제외
          const filtered = tracks.filter((t) => !selectedTracks.find((s) => s.id === t.id));
          dropdown.innerHTML = filtered.map((t) => `
            <div class="track-dropdown-item" data-track='${escHtml(JSON.stringify(t))}'>
              ${t.albumArt
                ? `<img class="track-dropdown-thumb" src="${escHtml(t.albumArt)}" alt="" />`
                : '<div class="track-dropdown-thumb" style="background:rgba(109,124,255,.2)"></div>'}
              <div style="min-width:0">
                <div style="font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(t.name)}</div>
                <div style="font-size:12px;color:var(--muted)">${escHtml(t.artist)}</div>
              </div>
            </div>`).join("") || '<div style="padding:12px;color:var(--muted);font-size:13px">이미 모두 추가됨</div>';
        } catch (err) {
          dropdown.innerHTML = `<div style="padding:12px;color:var(--danger);font-size:13px">${escHtml(err.message)}</div>`;
        }
      }

      dropdown.addEventListener("click", async (e) => {
        const item = e.target.closest("[data-track]");
        if (!item) return;
        if (selectedTracks.length >= MAX_TRACKS) return;

        const track = JSON.parse(item.dataset.track);
        selectedTracks.push(track);
        dropdown.hidden = true;
        searchInput.value = "";
        renderTrackList();
        updateAutoGenres(); // 트랙 추가 시 장르 자동 업데이트
      });

      document.addEventListener("click", (e) => {
        if (!e.target.closest(".track-search-wrap")) dropdown.hidden = true;
      });

      // ── 제출 ─────────────────────────────────────────────────────────────────
      document.querySelector("#formWrite").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.querySelector("#btnSubmit");
        btn.disabled = true;
        btn.textContent = "게시 중…";
        setNotice("", "");

        try {
          const title = titleInput.value.trim();
          if (!title) throw new Error("제목을 입력해주세요.");

          let targetId;
          if (editId) {
            await updatePost(editId, {
              title,
              body: bodyInput.value,
              genre: [...selectedGenres],
              tags: [...selectedMoods],
              tracks: selectedTracks,
            });
            targetId = editId;
            showToast("수정되었습니다!");
          } else {
            targetId = await createPost({
              title,
              body: bodyInput.value,
              genre: [...selectedGenres],
              tags: [...selectedMoods],
              tracks: selectedTracks,
            });
            showToast("게시글이 등록되었습니다! 🎵");
          }
          // replace로 write 페이지 히스토리 교체 + edited=1로 구 상세 건너뜀 신호
          window.location.replace(`post.html?edited=1#${targetId}`);
        } catch (err) {
          setNotice("danger", err.message);
          btn.disabled = false;
          btn.textContent = editId ? "수정하기" : "게시하기";
        }
      });

      // ── 수정 모드 초기화 (변수/함수 선언 이후에 실행) ────────────────
      if (editId) {
        document.querySelector("h1.title").textContent = "글 수정";
        document.querySelector("#btnSubmit").textContent = "수정하기";
        try {
          const post = await getPost(editId);
          if (post) {
            titleInput.value = post.title || "";
            bodyInput.value  = post.body  || "";
            titleCount.textContent = titleInput.value.length;
            bodyCount.textContent  = bodyInput.value.length;
            (post.tags || []).forEach((m) => {
              const chip = document.querySelector(`#moodSelector [data-mood="${m}"]`);
              if (chip) { selectedMoods.add(m); chip.classList.add("selected"); }
            });
            selectedTracks.push(...(post.tracks || []));
            // 트랙에 genreName 있으면 자동 재계산, 없으면 저장된 장르를 그대로 표시
            if (selectedTracks.some((t) => t.genreName)) {
              updateAutoGenres();
            } else {
              (post.genre || []).forEach((g) => selectedGenres.add(g));
              renderGenreChips();
            }
          }
        } catch {
          setNotice("danger", "게시글을 불러오지 못했습니다.");
        }
      }

      renderTrackList();
    </script>
  </body>
</html>
