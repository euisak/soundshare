<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundShare — 글쓰기</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js" crossorigin />
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js" crossorigin />
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js" crossorigin />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/write.css" />
  </head>
  <body class="list-page">

    <!-- ── 헤더 ─────────────────────────────────────────── -->
    <div class="le-header">
      <h1 class="le-heading" id="pageHeading">새 포스트</h1>
      <div class="le-header-actions">
        <a href="index.html" class="le-cancel">취소</a>
        <button class="le-publish" id="btnPublish" type="button">게시하기</button>
      </div>
    </div>

    <!-- ── 본문 (2열) ────────────────────────────────────── -->
    <div class="le-body">

      <!-- 왼쪽: 폼 -->
      <div class="le-left">

        <div id="notice" class="notice" style="margin-bottom:16px" hidden></div>

        <div class="le-field">
          <label class="le-label">제목 <span class="le-required">*</span></label>
          <input class="le-input" id="postTitle" type="text" maxlength="50"
                 placeholder="어떤 곡을 추천하고 싶으신가요?" autocomplete="off" />
          <div style="font-size:11px;color:#bbb;margin-top:4px;text-align:right">
            <span id="titleCount">0</span>/50
          </div>
        </div>

        <div class="le-field">
          <label class="le-label">추천 이유</label>
          <div class="le-desc-editor">
            <div class="le-desc-toolbar" id="descToolbar">
              <button type="button" data-cmd="bold"          title="굵게"><b>B</b></button>
              <button type="button" data-cmd="italic"        title="기울임"><i>I</i></button>
              <button type="button" data-cmd="strikeThrough" title="취소선"><s>S</s></button>
              <button type="button" data-cmd="createLink"    title="링크">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                  <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                </svg>
              </button>
            </div>
            <div class="le-desc-content" id="postBody"
                 contenteditable="true" spellcheck="false"></div>
          </div>
        </div>

        <div class="le-field">
          <label class="le-label">태그</label>
          <div class="le-tags-wrap" id="tagsWrap">
            <input class="le-tags-input" id="tagsInput" type="text"
                   placeholder="태그 추가 (Enter)..." autocomplete="off" maxlength="10" />
          </div>
          <div class="le-tags-hint" id="tagsHint">최대 5개 · 태그당 10자 <span id="tagsCount">(0/5)</span></div>
        </div>

        <div class="le-field">
          <span class="le-settings-label">설정</span>
          <div class="le-setting-row">
            <div class="le-setting-text">
              <div class="le-setting-name">공개 여부</div>
              <div class="le-setting-desc">공개하면 다른 사람도 이 글을 볼 수 있어요.</div>
            </div>
            <select class="le-select" id="settingVisibility">
              <option value="public">공개</option>
              <option value="private">비공개</option>
            </select>
          </div>
        </div>

      </div><!-- /le-left -->

      <!-- 오른쪽: 검색 + 트랙 목록 -->
      <div class="le-right">

        <!-- 검색 바 -->
        <div class="le-search-bar">
          <div class="le-search-inner">
            <span class="le-search-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
              </svg>
            </span>
            <input class="le-search-input" id="searchInput" type="search"
                   placeholder="가수 이름, 노래 제목, 앨범으로 검색..." autocomplete="off" />
          </div>
          <div class="le-search-results" id="searchResults" hidden></div>
        </div>

        <!-- 트랙 헤더 -->
        <div class="le-releases-header">
          <span class="le-releases-title">
            트랙 <span class="le-releases-count" id="releasesCount">0</span>
          </span>
        </div>

        <!-- 트랙 목록 -->
        <div class="le-releases-list" id="releasesList">
          <div class="le-empty-state" id="emptyState">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ddd"
                 stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
            </svg>
            <span>위 검색창에서 곡을 추가하세요</span>
          </div>
        </div>

      </div><!-- /le-right -->
    </div><!-- /le-body -->

    <script src="config.js"></script>
    <script type="module">
      import { loadHeader, requireAuth, setNotice } from "./js/app.js";
      import { createPost, updatePost, getPost }    from "./js/post.js";
      import { searchTracksItunes }                 from "./js/music.js";
      import { escHtml, showToast }                 from "./js/ui.js";

      await requireAuth();

      const editId = window.location.hash.slice(1) || null;
      if (editId) {
        document.getElementById("pageHeading").textContent = "포스트 수정";
        document.getElementById("btnPublish").textContent  = "수정하기";
        document.title = "SoundShare — 포스트 수정";
      }

      // ── 제목 카운터 ──────────────────────────────────────
      const titleInput  = document.getElementById("postTitle");
      const titleCount  = document.getElementById("titleCount");
      titleInput.addEventListener("input", () => {
        titleCount.textContent = titleInput.value.length;
        titleInput.classList.remove("le-input--error");
      });

      // ── Description 툴바 ─────────────────────────────────
      document.getElementById("descToolbar").addEventListener("mousedown", (e) => {
        const btn = e.target.closest("[data-cmd]");
        if (!btn) return;
        e.preventDefault();
        const cmd = btn.dataset.cmd;
        if (cmd === "createLink") {
          const url = prompt("URL을 입력하세요:");
          if (url) document.execCommand("createLink", false, url);
        } else {
          document.execCommand(cmd, false, null);
        }
        document.getElementById("postBody").focus();
      });

      // ── 태그 ─────────────────────────────────────────────
      const MAX_TAGS = 5;
      const tags = [];
      const tagsWrapEl = document.getElementById("tagsWrap");

      function renderTags() {
        const atLimit = tags.length >= MAX_TAGS;
        const chips = tags.map((t) => `
          <span class="le-tag-chip">
            ${escHtml(t)}
            <button type="button" class="le-tag-remove" data-tag="${escHtml(t)}">×</button>
          </span>`).join("");
        tagsWrapEl.innerHTML = chips + (atLimit ? "" :
          `<input class="le-tags-input" id="tagsInput" type="text"
                  placeholder="태그 추가 (Enter)..." autocomplete="off" maxlength="10" />`);
        if (!atLimit) {
          document.getElementById("tagsInput").addEventListener("keydown", onTagKey);
        }
        document.getElementById("tagsCount").textContent = `(${tags.length}/5)`;
        document.getElementById("tagsCount").className = atLimit ? "at-limit" : "";
      }

      function addTag(val) {
        const tag = val.trim().slice(0, 10);
        if (!tag || tags.includes(tag) || tags.length >= MAX_TAGS) return;
        tags.push(tag);
        renderTags();
      }

      function onTagKey(e) {
        if (e.key === "Enter" || e.key === ",") {
          e.preventDefault();
          addTag(e.target.value);
          e.target.value = "";
        } else if (e.key === "Backspace" && !e.target.value && tags.length) {
          tags.pop();
          renderTags();
        }
      }

      document.getElementById("tagsInput").addEventListener("keydown", onTagKey);
      tagsWrapEl.addEventListener("click", (e) => {
        const btn = e.target.closest(".le-tag-remove");
        if (!btn) return;
        const i = tags.indexOf(btn.dataset.tag);
        if (i > -1) { tags.splice(i, 1); renderTags(); }
      });

      // ── 장르 (저장용으로만 유지) ─────────────────────────
      const selectedGenres = new Set();

      function updateAutoGenres() {
        selectedGenres.clear();
        tracks.forEach((t) => { if (t.genreName) selectedGenres.add(t.genreName); });
      }

      // ── 트랙 목록 ────────────────────────────────────────
      const tracks = [];
      const releasesListEl  = document.getElementById("releasesList");
      const releasesCountEl = document.getElementById("releasesCount");
      const emptyStateEl    = document.getElementById("emptyState");

      function renderTracks() {
        releasesCountEl.textContent = tracks.length;
        emptyStateEl.hidden = tracks.length > 0;

        const items = tracks.map((t, i) => `
          <div class="le-release-item" draggable="true" data-idx="${i}">
            <span class="le-release-num">${i + 1}</span>
            ${t.albumArt
              ? `<img class="le-release-thumb" src="${escHtml(t.albumArt)}" alt="" style="cursor:default" />`
              : `<div class="le-release-thumb" style="display:flex;align-items:center;justify-content:center;font-size:18px">♪</div>`}
            <div class="le-release-info">
              <span class="le-release-name" style="cursor:default">${escHtml(t.name)}</span>
              <div class="le-release-meta">${escHtml(t.artist)}${t.album ? " · " + escHtml(t.album) : ""}</div>
              <div class="le-release-note" contenteditable="true" data-idx="${i}"
                   data-placeholder="이 곡에 대한 메모...">${escHtml(t.note || "")}</div>
            </div>
            <div class="le-release-actions">
              <button class="le-release-btn" type="button" data-remove="${i}" aria-label="제거"
                      title="제거">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.5" stroke-linecap="round">
                  <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
              </button>
              <button class="le-release-btn le-release-drag" type="button" aria-label="순서 변경">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M9 5h2M9 12h2M9 19h2M13 5h2M13 12h2M13 19h2"/>
                </svg>
              </button>
            </div>
          </div>`).join("");

        // 빈 상태 유지하되 items 앞에 emptyState 남김
        releasesListEl.innerHTML = items;
        if (!tracks.length) releasesListEl.appendChild(emptyStateEl);
        emptyStateEl.hidden = tracks.length > 0;
        setupDnd();
      }

      releasesListEl.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-remove]");
        if (!btn) return;
        tracks.splice(Number(btn.dataset.remove), 1);
        renderTracks();
        updateAutoGenres();
      });

      releasesListEl.addEventListener("input", (e) => {
        const el = e.target.closest(".le-release-note");
        if (el) tracks[Number(el.dataset.idx)].note = el.innerText.trim();
      });

      // ── Drag & Drop ──────────────────────────────────────
      let dragIdx = null;

      function setupDnd() {
        releasesListEl.querySelectorAll(".le-release-item").forEach((item) => {
          item.addEventListener("dragstart", (e) => {
            dragIdx = Number(item.dataset.idx);
            item.classList.add("le-dragging");
            e.dataTransfer.effectAllowed = "move";
          });
          item.addEventListener("dragend",  () => item.classList.remove("le-dragging"));
          item.addEventListener("dragover", (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; });
          item.addEventListener("drop", (e) => {
            e.preventDefault();
            const to = Number(item.dataset.idx);
            if (dragIdx === null || dragIdx === to) return;
            const [moved] = tracks.splice(dragIdx, 1);
            tracks.splice(to, 0, moved);
            renderTracks();
            updateAutoGenres();
            dragIdx = null;
          });
        });
      }

      // ── 검색 ─────────────────────────────────────────────
      const searchInputEl   = document.getElementById("searchInput");
      const searchResultsEl = document.getElementById("searchResults");
      let searchTimer = null;

      searchInputEl.addEventListener("input", (e) => {
        clearTimeout(searchTimer);
        const q = e.target.value.trim();
        if (!q) { searchResultsEl.hidden = true; return; }
        if (q.length < 2) {
          searchResultsEl.hidden = false;
          searchResultsEl.innerHTML = '<div class="le-search-msg">두 글자 이상 입력하세요.</div>';
          return;
        }
        searchResultsEl.hidden = false;
        searchResultsEl.innerHTML = '<div class="le-search-msg">검색 중...</div>';
        searchTimer = setTimeout(() => doSearch(q), 350);
      });

      async function doSearch(q) {
        try {
          const results = await searchTracksItunes(q, 25);
          if (!results.length) {
            searchResultsEl.innerHTML = '<div class="le-search-msg">결과가 없습니다.</div>';
            return;
          }
          searchResultsEl.innerHTML = results.map((r, i) => `
            <div class="le-search-result" data-idx="${i}">
              ${r.albumArt
                ? `<img class="le-search-thumb" src="${escHtml(r.albumArt)}" alt="" />`
                : '<div class="le-search-thumb" style="display:flex;align-items:center;justify-content:center;font-size:16px">♪</div>'}
              <div class="le-search-info">
                <div class="le-search-name">${escHtml(r.name)}</div>
                <div class="le-search-meta">${escHtml(r.artist)}${r.album ? " · " + escHtml(r.album) : ""}</div>
              </div>
            </div>`).join("");

          searchResultsEl.querySelectorAll(".le-search-result").forEach((el) => {
            el.addEventListener("click", () => {
              const r = results[Number(el.dataset.idx)];
              if (!tracks.find((x) => x.id === r.id)) {
                tracks.push(r);
                renderTracks();
                updateAutoGenres();
              }
              searchInputEl.value = "";
              searchResultsEl.hidden = true;
            });
          });
        } catch (err) {
          searchResultsEl.innerHTML = `<div class="le-search-msg" style="color:#e55">검색 중 오류가 발생했습니다.</div>`;
          console.error(err);
        }
      }

      // 검색창 포커스 시 기존 검색어 있으면 결과 다시 표시
      searchInputEl.addEventListener("focus", () => {
        const q = searchInputEl.value.trim();
        if (q.length >= 2 && searchResultsEl.innerHTML) {
          searchResultsEl.hidden = false;
        }
      });

      document.addEventListener("click", (e) => {
        if (!e.target.closest(".le-search-bar")) searchResultsEl.hidden = true;
      });

      // ── 게시 / 수정 ───────────────────────────────────────
      document.getElementById("btnPublish").addEventListener("click", async () => {
        const title = titleInput.value.trim();
        if (!title) {
          titleInput.classList.add("le-input--error");
          titleInput.focus();
          return;
        }
        const btn = document.getElementById("btnPublish");
        btn.disabled = true;
        btn.textContent = editId ? "수정 중…" : "게시 중…";

        try {
          const payload = {
            title,
            body:       document.getElementById("postBody").innerHTML,
            genre:      [...selectedGenres],
            tags:       [...tags],
            tracks,
            visibility: document.getElementById("settingVisibility").value,
          };

          let targetId;
          if (editId) {
            await updatePost(editId, payload);
            targetId = editId;
            showToast("수정되었습니다!");
          } else {
            targetId = await createPost(payload);
            showToast("게시글이 등록되었습니다! 🎵");
          }
          window.location.replace(`post.html?edited=1#${targetId}`);
        } catch (err) {
          const noticeEl = document.getElementById("notice");
          noticeEl.hidden = false;
          noticeEl.className = "notice danger";
          noticeEl.textContent = err.message;
          btn.disabled = false;
          btn.textContent = editId ? "수정하기" : "게시하기";
        }
      });

      // ── 수정 모드 초기화 ─────────────────────────────────
      if (editId) {
        try {
          const post = await getPost(editId);
          if (post) {
            titleInput.value = post.title || "";
            titleCount.textContent = titleInput.value.length;
            document.getElementById("postBody").innerHTML = post.body || "";
            (post.tags || []).forEach((t) => { tags.push(t); });
            renderTags();
            if (Array.isArray(post.tracks)) tracks.push(...post.tracks);
            updateAutoGenres();
            document.getElementById("settingVisibility").value = post.visibility || "public";
          }
        } catch {
          const noticeEl = document.getElementById("notice");
          noticeEl.hidden = false;
          noticeEl.className = "notice danger";
          noticeEl.textContent = "게시글을 불러오지 못했습니다.";
        }
      }

      renderTracks();
    </script>
  </body>
</html>
