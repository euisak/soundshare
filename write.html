<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundShare — 글쓰기</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/write.css" />
  </head>
  <body class="list-page">

    <!-- ── 헤더 ─────────────────────────────────────────── -->
    <div class="le-header">
      <h1 class="le-heading" id="pageHeading">새 포스트</h1>
      <div class="le-header-actions">
        <a href="index.html" class="le-cancel">취소</a>
        <button class="le-publish" id="btnPublish" type="button">게시하기</button>
      </div>
    </div>

    <!-- ── 본문 (2열) ────────────────────────────────────── -->
    <div class="le-body">

      <!-- 왼쪽: 폼 -->
      <div class="le-left">

        <div id="notice" class="notice" style="margin-bottom:16px" hidden></div>

        <div class="le-field">
          <label class="le-label">제목 <span class="le-required">*</span></label>
          <input class="le-input" id="postTitle" type="text" maxlength="50"
                 placeholder="어떤 곡을 추천하고 싶으신가요?" autocomplete="off" />
          <div style="font-size:11px;color:#bbb;margin-top:4px;text-align:right">
            <span id="titleCount">0</span>/50
          </div>
        </div>

        <div class="le-field">
          <label class="le-label">추천 이유</label>
          <textarea class="le-desc-content" id="postBody" rows="5" spellcheck="false" placeholder="이 음악을 추천하는 이유를 적어주세요."></textarea>
        </div>

        <div class="le-field">
          <label class="le-label">태그</label>
          <div class="le-tags-wrap" id="tagsWrap">
            <input class="le-tags-input" id="tagsInput" type="text"
                   placeholder="태그 추가 (Enter)..." autocomplete="off" maxlength="10" />
          </div>
          <div class="le-tags-hint" id="tagsHint">최대 5개 · 태그당 10자 <span id="tagsCount">(0/5)</span></div>
        </div>

        <div class="le-field">
          <span class="le-settings-label">설정</span>
          <div class="le-setting-row">
            <div class="le-setting-text">
              <div class="le-setting-name">공개 여부</div>
              <div class="le-setting-desc">공개하면 다른 사람도 이 글을 볼 수 있어요.</div>
            </div>
            <select class="le-select" id="settingVisibility">
              <option value="public">공개</option>
              <option value="private">비공개</option>
            </select>
          </div>
        </div>

      </div><!-- /le-left -->

      <!-- 오른쪽: 검색 + 트랙 목록 -->
      <div class="le-right">

        <!-- 검색 바 -->
        <label class="le-label">노래 검색</label>
        <div class="le-search-bar">
          <div class="le-search-inner">
            <span class="le-search-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
              </svg>
            </span>
            <input class="le-search-input" id="searchInput" type="search"
                   placeholder="가수 이름, 노래 제목, 앨범으로 검색..." autocomplete="off" />
          </div>
          <div class="le-search-results" id="searchResults" hidden></div>
        </div>

        <!-- 트랙 헤더 -->
        <div class="le-releases-header">
          <span class="le-releases-title">
            트랙 <span class="le-releases-count" id="releasesCount">0</span>
          </span>
        </div>

        <!-- 트랙 목록 -->
        <div class="le-releases-list" id="releasesList">
          <div class="le-empty-state" id="emptyState">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ddd"
                 stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
            </svg>
            <span>위 검색창에서 곡을 추가하세요</span>
          </div>
        </div>

      </div><!-- /le-right -->
    </div><!-- /le-body -->

    <script src="config.js"></script>
    <script type="module" src="js/write-page.js"></script>
  </body>
</html>
