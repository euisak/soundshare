<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SoundShare — 설정</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/settings.css" />
  </head>
  <body>
    <script src="js/header-loader.js"></script>

    <main class="settings-main">

      <button class="back-btn" onclick="history.length > 1 ? history.back() : location.href='mypage.html'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
        뒤로
      </button>

      <h1 class="settings-title">설정</h1>

      <!-- ── 프로필 ──────────────────────────────────────────── -->
      <div class="settings-section">
        <div class="settings-profile-row">
          <div class="photo-upload-wrap" id="photoUploadWrap" title="프로필 사진 변경">
            <div class="photo-upload-avatar" id="profileAvatar">?</div>
            <div class="photo-upload-overlay">사진<br>변경</div>
            <input type="file" id="photoFileInput" accept=".jpg,.jpeg,.png" class="hidden-file" />
          </div>
          <div class="settings-profile-info">
            <div id="profileName" class="settings-profile-name">-</div>
            <div id="profileEmail" class="muted small settings-profile-email">-</div>
          </div>
        </div>
        <div id="photoSaveRow" hidden class="settings-photo-save-row">
          <div id="noticePhoto" class="notice notice-flex" hidden></div>
          <button class="btn primary btn-shrink" id="btnSavePhoto">사진 저장</button>
          <button class="btn btn-shrink" id="btnCancelPhoto">취소</button>
        </div>
      </div>

      <!-- ── 닉네임 변경 ─────────────────────────────────────── -->
      <div class="settings-section">
        <div class="settings-section-title">닉네임 변경</div>
        <div id="noticeNickname" class="notice notice--mb" hidden></div>
        <form id="formNickname" class="stack" novalidate>
          <div>
            <label for="newNickname" class="form-label">새 닉네임 <span class="muted small">(최대 10자)</span></label>
            <div class="input-with-btn">
              <input id="newNickname" class="input" type="text" maxlength="10"
                     placeholder="변경할 닉네임 입력" autocomplete="off" />
              <button type="button" class="btn btn-shrink" id="btnCheckNick">중복확인</button>
            </div>
            <span id="nickStatus" class="small status-hint"></span>
          </div>
          <button class="btn primary" type="submit" id="btnSaveNick" disabled>저장</button>
        </form>
      </div>

      <!-- ── 비밀번호 변경 ──────────────────────────────────── -->
      <div class="settings-section">
        <div class="settings-section-title">비밀번호 변경</div>
        <div id="noticePw" class="notice notice--mb" hidden></div>
        <form id="formPassword" class="stack" novalidate>
          <div>
            <label for="currentPw" class="form-label">현재 비밀번호</label>
            <input id="currentPw" class="input" type="password" autocomplete="current-password"
                   placeholder="현재 비밀번호" maxlength="30" />
          </div>
          <div>
            <label for="newPw" class="form-label">새 비밀번호 <span class="muted small">(특수기호 포함 8~30자)</span></label>
            <input id="newPw" class="input" type="password" autocomplete="new-password"
                   placeholder="새 비밀번호" maxlength="30" />
          </div>
          <div>
            <label for="newPwConfirm" class="form-label">새 비밀번호 확인</label>
            <input id="newPwConfirm" class="input" type="password" autocomplete="new-password"
                   placeholder="새 비밀번호 재입력" maxlength="30" />
            <span id="pwConfirmStatus" class="small status-hint"></span>
          </div>
          <button class="btn primary" type="submit" id="btnSavePw" disabled>변경</button>
        </form>
      </div>

      <!-- ── 공개 범위 ──────────────────────────────────────── -->
      <div class="settings-section">
        <div class="settings-section-title">공개 범위</div>
        <div>
          <div class="settings-privacy-row">
            <div>
              <div class="settings-privacy-name">작성한 게시글</div>
              <div class="muted small settings-privacy-desc">내 프로필에서 작성한 글 목록을 공개합니다</div>
            </div>
            <label class="toggle">
              <input type="checkbox" id="togglePosts" />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="settings-privacy-row">
            <div>
              <div class="settings-privacy-name">작성한 댓글</div>
              <div class="muted small settings-privacy-desc">내 프로필에서 작성한 댓글 목록을 공개합니다</div>
            </div>
            <label class="toggle">
              <input type="checkbox" id="toggleComments" />
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
        <div id="noticePrivacy" class="notice notice--mt" hidden></div>
      </div>

      <!-- ── 회원탈퇴 ──────────────────────────────────────── -->
      <div class="settings-section--last">
        <div id="noticeDelete" class="notice notice--mb" hidden></div>
        <div id="deleteConfirmArea" hidden class="settings-delete-confirm">
          <form id="formDelete" class="stack" novalidate>
            <div>
              <label for="deletePw" class="form-label">비밀번호를 입력해 탈퇴를 확인해주세요</label>
              <input id="deletePw" class="input" type="password" autocomplete="current-password"
                     placeholder="현재 비밀번호" maxlength="30" />
            </div>
            <div class="input-with-btn">
              <button class="btn btn-danger btn-flex" type="submit">탈퇴 확인</button>
              <button class="btn" type="button" id="btnCancelDelete">취소</button>
            </div>
          </form>
        </div>
        <button class="btn btn-danger btn-full" id="btnShowDelete">회원 탈퇴</button>
      </div>

    </main>

    <script src="config.js"></script>
    <script type="module" src="js/settings-page.js"></script>
  </body>
</html>
